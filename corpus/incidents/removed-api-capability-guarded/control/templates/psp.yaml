apiVersion: v1
kind: ConfigMap
metadata:
  name: app
data:
  ok: "yes"
{{- if .Capabilities.APIVersions.Has "policy/v1beta1" }}
---
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: app
spec:
  privileged: false
  seLinux:
    rule: RunAsAny
  supplementalGroups:
    rule: RunAsAny
  runAsUser:
    rule: RunAsAny
  fsGroup:
    rule: RunAsAny
{{- end }}

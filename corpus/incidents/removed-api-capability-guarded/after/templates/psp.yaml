apiVersion: v1
kind: ConfigMap
metadata:
  name: app
data:
  ok: "yes"
---
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: app
spec:
  privileged: false
  seLinux:
    rule: RunAsAny
  supplementalGroups:
    rule: RunAsAny
  runAsUser:
    rule: RunAsAny
  fsGroup:
    rule: RunAsAny

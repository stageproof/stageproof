id: job-pod-template-changed
summary: A Job that is not a Helm hook changed its pod template. Kubernetes rejects that update.
k8s: "1.35"
expect: {verdict: BLOCKED, rules: [k8s.apply.immutable_field]}
control_expect: {verdict: PASSED}
status: active
source: Job pod templates are immutable. The control is a pre-upgrade hook whose template changes. Helm deletes and recreates hook Jobs.

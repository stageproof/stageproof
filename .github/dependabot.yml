version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # v4 installs Cosign 3. The release workflow signs with Cosign 2 commands.
      - dependency-name: sigstore/cosign-installer
        update-types:
          - version-update:semver-major

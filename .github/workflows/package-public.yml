name: package-public

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - name: Make the container image public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH /orgs/stageproof/packages/container/stageproof -f visibility=public
          gh api /orgs/stageproof/packages/container/stageproof --jq .visibility

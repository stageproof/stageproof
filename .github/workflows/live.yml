name: live

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "internal/rehearse/**"
      - "internal/check/live.go"
      - "internal/config/**"
      - "cmd/**"
      - ".github/workflows/live.yml"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  live:
    name: live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1
      - name: Install kind and kubectl
        run: |
          set -eu
          curl -fsSL -o /tmp/kind "https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64"
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  /tmp/kind" | sha256sum -c -
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/v1.35.10/bin/linux/amd64/kubectl"
          echo "c49a28f1f4efc4d475ed05f47f2ce8e563bf7bef69ed77fe1b924ea6d83b6327  /tmp/kubectl" | sha256sum -c -
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kind version
          kubectl version --client
      - name: Rehearse on kind
        env:
          STAGEPROOF_KIND_E2E: "1"
        run: go test ./internal/rehearse/ -run E2E -timeout 30m -count=1 -v

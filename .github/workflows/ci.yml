name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.1
      - name: Test
        run: go test ./...

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  helm:
    name: helm ${{ matrix.helm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm: ["v3.22.1", "v4.3.2"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
      - uses: azure/setup-helm@v5
        with:
          version: ${{ matrix.helm }}
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m

  # The branch protection rule looks for this exact check name.
  test:
    needs: helm
    runs-on: ubuntu-latest
    steps:
      - name: Helm matrix passed
        run: echo "Helm 3.22.1 and Helm 4.3.2 passed"

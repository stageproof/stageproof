name: corpus

on:
  pull_request:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: hashFiles('corpus/pairs/pairs.lock') != ''
        with:
          path: ~/.cache/stageproof/charts
          key: pairs-${{ hashFiles('corpus/pairs/pairs.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/stageproof/envtest
          key: envtest-1.35-${{ runner.os }}-${{ runner.arch }}
      - name: Incidents
        run: go run ./cmd/corpus run --set incidents --out incidents.json
      - name: Pairs (files)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: go run ./cmd/corpus run --set pairs --api-server off --out pairs-files.json
      - name: Pairs
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            go run ./cmd/corpus run --set pairs --api-server auto --out pairs.json
          else
            go run ./cmd/corpus run --set pairs --pr --out pairs.json
          fi
      - name: Compare
        run: |
          go run ./cmd/corpus compare incidents.json corpus/baseline.json
          if [ -f pairs-files.json ]; then
            go run ./cmd/corpus compare pairs-files.json corpus/baseline.json
          fi
          go run ./cmd/corpus compare pairs.json corpus/baseline.json
      - name: Results
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-results
          path: |
            incidents.json
            pairs-files.json
            pairs.json

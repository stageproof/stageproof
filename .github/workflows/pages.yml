name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push must not cancel a deploy that has already uploaded its artifact.
# Cancelled deploys are the runs that then report a missing artifact, or two
# artifacts with the name github-pages. Queued runs still wait their turn.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web

  # Deploy is a separate job so it starts only after the artifact upload has
  # finished. In one job, deploy-pages lists artifacts before that upload is
  # visible and fails with "found 0 artifacts".
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;
    access_log /dev/stdout;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self';" always;

        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;

        if ($request_uri ~* "(\.\.|%2e%2e|%2E%2E)") {
            return 400;
        }

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"stageproof-web"}';
        }

        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        location / {
            try_files $uri $uri.html $uri/ /index.html;
        }
    }
}

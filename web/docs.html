  <template data-topic="cluster-upgrade" data-group="Guides" data-title="Prepare for a Kubernetes cluster upgrade">
<p class="docs-lede">Find out which charts will stop working after you upgrade the cluster itself to a newer Kubernetes version. Stageproof warns you while the chart still works, so you can migrate it first.</p>

<dl class="doc-facts">
  <div><dt>Use it when</dt><dd>You plan to move your cluster to a newer Kubernetes version.</dd></div>
  <div><dt>Finds</dt><dd>Resources that work on the version you run and are removed in the version you plan to run.</dd></div>
  <div><dt>Needs</dt><dd>Helm. No cluster. Stageproof does not upgrade a cluster.</dd></div>
</dl>

<h2>Two flags, two meanings</h2>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Flag</th><th>Meaning</th><th>A removed API becomes</th></tr></thead>
  <tbody>
    <tr><td><code>--current-k8s</code></td><td>The Kubernetes version your cluster runs today.</td><td>An <code>ERROR</code>. The chart is broken now.</td></tr>
    <tr><td><code>--next-k8s</code></td><td>The Kubernetes version you plan to upgrade the cluster to.</td><td>A <code>WARN</code>. The chart works now and will break after the cluster upgrade.</td></tr>
  </tbody>
</table></div>

<h2>The example</h2>
<p>Your cluster runs Kubernetes 1.31. You plan to upgrade it to 1.32. You want to know whether the <code>ratelimit</code> chart survives that.</p>

<h2>Run the check</h2>
<pre data-kind="cmd">
stageproof check --new-chart ./ratelimit --current-k8s 1.31 --next-k8s 1.32</pre>
<pre data-kind="out">
stageproof  PASSED  exit 0
compare  (single-chart check) -> ./ratelimit
k8s  1.31  next 1.32  ·  checked: files

  ✓ PASS  helm template            rendered 1 Kubernetes object cleanly
  ✓ PASS  values.yaml AST          no custom -f overlay passed (default chart values verified)
  ✓ PASS  k8s 1.31 compatibility   0 blockers (1 deprecation, EOL, or CRD warning)

  WARN  k8s.api.eol_blocker
         FlowSchema/default/stageproof-rel-tenants
         API `flowcontrol.apiserver.k8s.io/v1beta3` (FlowSchema) works on 1.31, but is REMOVED in next EOL target Kubernetes 1.32.
         Migrate to `flowcontrol.apiserver.k8s.io/v1` before upgrading cluster to 1.32.

verdict  PASSED (exit 0)  · 46ms · 0 AI calls</pre>

<h2>What the result means</h2>
<p>The result is not blocked, because the chart works on the cluster you have. The <code>k8s.api.eol_blocker</code> warning is the finding to act on: this resource stops working when the cluster reaches 1.32. Migrate it to <code>flowcontrol.apiserver.k8s.io/v1</code> before you upgrade the cluster.</p>
<p>The <code>k8s</code> line shows both versions: <code>1.31  next 1.32</code>.</p>

<h2>Check every chart you run</h2>
<p>This command checks one chart. To review a whole cluster before an upgrade, run it once for each chart you deploy, with the values you deploy it with.</p>
<p>To get the warning on every future change as well, set <code>nextKubernetes</code> in the <a href="#config">configuration file</a>.</p>
  </template>

  <template data-topic="live" data-group="Guides" data-title="Rehearse the upgrade in a temporary cluster">
<p class="docs-lede">Add <code>--live</code> to carry out the upgrade for real, in a temporary Kubernetes cluster on the machine that runs the command. This is the only way to reach the result <code>PROVEN</code>.</p>

<dl class="doc-facts">
  <div><dt>Use it when</dt><dd>You want proof that the upgrade works on a running release, and that you can roll it back.</dd></div>
  <div><dt>Finds</dt><dd>Pods that fail to start or restart after the upgrade, a failed <code>helm upgrade</code>, a failed <code>smoke</code> command, and a failed <code>helm rollback</code>.</dd></div>
  <div><dt>Needs</dt><dd>Helm, kind, kubectl, and Docker on the machine that runs the command.</dd></div>
</dl>

<h2>Why a normal CI job skips this</h2>
<p><code>--live</code> starts a real Kubernetes node. That node is a container, and it has to set up its own networking and start more containers. An unprivileged container is blocked from doing those things, so kind has nothing to run the node with. The file check still runs, and the report says <code>NOT TESTED LIVE</code>.</p>

<h2>What <code>--live</code> does not do</h2>
<ul>
  <li><strong>It does not fix anything.</strong> It reports a result. It does not edit files, commit, or push.</li>
  <li><strong>It does not connect to your real cluster.</strong> It creates its own cluster and uses a separate, temporary kubeconfig. Your kubeconfig is not changed.</li>
</ul>

<h2>Run the check</h2>
<pre data-kind="cmd">
stageproof check --current-chart ./webapp-1.4.0 --new-chart ./webapp-1.5.0 -f values-prod.yaml --live</pre>
<pre data-kind="out">
stageproof  PROVEN  exit 0
compare  ./webapp-1.4.0 -> ./webapp-1.5.0
values  values-prod.yaml
k8s  1.33  ·  checked: files, live cluster

  ✓ PASS  helm template            rendered 1 Kubernetes object cleanly
  ✓ PASS  values.yaml AST          2 keys: 0 proven by rendering, 2 read in templates
  ✓ PASS  k8s 1.33 compatibility   0 removed APIs or selector breaks on K8s 1.33
  ✓ PASS  kind cluster boot        isolated cluster `stageproof-ephemeral` ready on Kubernetes v1.33.12
  ✓ PASS  baseline install         baseline revision 1 healthy in 7.3s
  ✓ PASS  in-place helm upgrade    upgraded cleanly in 400ms (0 restarts)
  ✓ PASS  rollback rehearsal       reverted to revision 1 cleanly in 200ms

verdict  PROVEN (exit 0)  · 41393ms · 0 AI calls</pre>

<h2>What happens, step by step</h2>
<ol>
  <li><strong>File checks run first.</strong> If they find an error, Stageproof stops with <code>BLOCKED</code> and does not create a cluster.</li>
  <li><strong>A cluster is created.</strong> Stageproof starts a kind cluster named <code>stageproof-ephemeral</code>, on the Kubernetes version your cluster runs. This is most of the run time.</li>
  <li><strong>Missing CRDs are installed.</strong> If the chart creates resources whose CRD it does not ship, Stageproof installs the CRD from a built-in list. See the list below.</li>
  <li><strong>The current chart is installed</strong> in a new namespace. Stageproof waits until its pods are ready.</li>
  <li><strong>The new chart is applied as an upgrade</strong> of that release, with <code>helm upgrade --wait</code>. If the new chart has a <code>crds</code> directory, those CRDs are applied first. Stageproof then checks that every pod is ready and that no container restarted.</li>
  <li><strong>Smoke commands run</strong> when <code>.stageproof.yaml</code> lists them. They run after the upgrade and before the rollback. Each command is <code>sh -c</code>, with <code>KUBECONFIG</code> pointed at the temporary cluster and <code>STAGEPROOF_NAMESPACE</code> and <code>STAGEPROOF_RELEASE</code> set. A failure is <code>live.smoke_failed</code>, and Stageproof rolls the release back.</li>
  <li><strong>The release is rolled back</strong> to the first revision, and Stageproof waits until it is healthy again.</li>
  <li><strong>The cluster is deleted.</strong></li>
</ol>

<h2>Run a command after the upgrade</h2>
<p>The commands live in <code>.stageproof.yaml</code>. This file asks whether the Deployment is there after the upgrade.</p>
<pre data-kind="file" data-label=".stageproof.yaml">
currentKubernetes: "1.33"
smoke:
  - name: deploy
    run: kubectl get deploy -n "$STAGEPROOF_NAMESPACE"
    timeout: 30s</pre>
<pre data-kind="cmd">
stageproof check --api-server off --current-chart ./webapp-1.0.0 --new-chart ./webapp-1.1.0 --live --cluster-name sp-docs-smoke-ok --timeout 90s</pre>
<pre data-kind="out">
!  kind cluster sp-docs-smoke-ok
!  This rehearsal used an empty cluster. No existing data was in it.
stageproof  PROVEN  exit 0
compare  ./webapp-1.0.0 -> ./webapp-1.1.0
k8s  1.33  ·  checked: files, live cluster

  ✓ PASS  helm template            rendered 1 Kubernetes object cleanly
  ✓ PASS  values.yaml AST          no custom -f overlay passed (default chart values verified)
  ✓ PASS  image tags               no new or changed image
  ✓ PASS  impact                   Compared rendered objects. The API server did not run, so a default the server adds is not in this comparison.
  ✓ PASS  k8s 1.33 compatibility   0 removed APIs or selector breaks on K8s 1.33
  ✓ PASS  kind cluster boot        isolated cluster `sp-docs-smoke-ok` ready on Kubernetes v1.33.12
  ✓ PASS  baseline install         baseline revision 1 healthy in 6.2s
  ✓ PASS  in-place helm upgrade    empty cluster upgraded in 500ms, 0 restarts. No existing data was in this cluster.
  ✓ PASS  smoke: deploy            passed
  ✓ PASS  rollback rehearsal       reverted to revision 1 cleanly in 200ms

verdict  PROVEN (exit 0)  · 37232ms · 0 AI calls</pre>
<p>The smoke line is before the rollback. The command saw the upgraded release.</p>

<h2>When the upgrade fails</h2>
<p>In this run, chart 1.6.0 starts the container with a command that exits with an error.</p>
<pre data-kind="cmd">
stageproof check --current-chart ./webapp-1.4.0 --new-chart ./webapp-1.6.0 -f values-prod.yaml --live</pre>
<pre data-kind="out">
stageproof  BLOCKED  exit 1
compare  ./webapp-1.4.0 -> ./webapp-1.6.0
values  values-prod.yaml
k8s  1.33  ·  checked: files, live cluster

  ✓ PASS  helm template            rendered 1 Kubernetes object cleanly
  ✓ PASS  values.yaml AST          2 keys: 0 proven by rendering, 2 read in templates
  ✓ PASS  k8s 1.33 compatibility   0 removed APIs or selector breaks on K8s 1.33
  ✓ PASS  kind cluster boot        isolated cluster `stageproof-ephemeral` ready on Kubernetes v1.33.12
  ✓ PASS  baseline install         baseline revision 1 healthy in 1.8s
  ✕ FAIL  in-place helm upgrade    pod `sp-rel-webapp-755977846f-4r2gf` CrashLoopBackOff (restarts=1)
  ✓ PASS  rollback rehearsal       reverted cleanly to revision 1 in 400ms after failed upgrade

  ERROR  helm.runtime.upgrade_failed
         sp-trial-886740/sp-rel
         In-place `helm upgrade` failed against healthy baseline: pod `sp-rel-webapp-755977846f-4r2gf` CrashLoopBackOff (restarts=1)
         aborted wait early on terminal pod state: sp-rel-webapp-755977846f-4r2gf: exited 1 (restarts=1)

verdict  BLOCKED (exit 1)  · 7180ms · 0 AI calls</pre>
<p>The file checks passed, so only the rehearsal could find this. The current chart was healthy, the new chart was not, and that makes the upgrade the cause. Stageproof still rehearses the rollback after a failed upgrade. Here it passed, so a rollback would have recovered the release.</p>
<p>Stageproof does not wait for the full timeout when a pod has clearly failed. It stops waiting as soon as a pod crashes or cannot pull its image.</p>

<h2>When the rehearsal cannot finish</h2>
<p>The temporary cluster is empty. It has no access to your private registry, your Secrets, or your databases. When the rehearsal stops for one of those reasons, Stageproof does not blame the upgrade.</p>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>What stopped the rehearsal</th><th>Result</th><th>Reason shown</th></tr></thead>
  <tbody>
    <tr><td>The chart needs a CRD that is not in the chart and not in the built-in list.</td><td><code>PASSED</code></td><td><code>missing_external_crds</code>. Pass the CRD with <code>--crd-file</code>. With <code>--require-rehearsal</code> the result is <code>NOT CHECKED</code>.</td></tr>
    <tr><td>The current chart cannot start in an empty cluster: an image in a private registry, a missing Secret or ConfigMap, a database that cannot be reached, or a storage class that does not exist.</td><td><code>PASSED</code></td><td><code>baseline_requires_external_dependency</code>. With <code>--require-rehearsal</code> the result is <code>NOT CHECKED</code>.</td></tr>
    <tr><td>The current chart fails to start for any other reason.</td><td><code>NOT CHECKED</code></td><td>The failure, on the <code>baseline install</code> line.</td></tr>
    <tr><td>The current release does not become ready before <code>--timeout</code>, the release still exists, and the upgrade of that release becomes ready. Rolling back hits the same deadline.</td><td><code>NOT CHECKED</code></td><td><code>baseline install</code> says <code>baseline slow</code>. <code>in-place helm upgrade</code> says the release that had not become ready was upgraded. <code>rollback rehearsal</code> says the current release still did not become ready. The result is not <code>PROVEN</code> and not <code>BLOCKED</code>.</td></tr>
    <tr><td>The cluster could not be created.</td><td><code>NOT CHECKED</code></td><td>The error from kind.</td></tr>
  </tbody>
</table></div>

<h2>The Kubernetes version of the temporary cluster</h2>
<p>The temporary cluster runs the same Kubernetes version as the file checks: the one you gave with <code>--current-k8s</code> or in the configuration file, and <code>1.33</code> when you gave none. The <code>kind cluster boot</code> line states the exact version, <code>v1.33.12</code> in the runs above.</p>
<p>kind publishes its cluster images for specific patch releases. Stageproof looks up the newest one for your version on Docker Hub and creates the cluster from it.</p>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Situation</th><th>What happens</th></tr></thead>
  <tbody>
    <tr><td>An image exists for your version.</td><td>The cluster runs your version.</td></tr>
    <tr><td>No image exists for your version, or Docker Hub cannot be reached.</td><td>The cluster runs the default version of your kind release. The report adds a <code>WARN</code> line named <code>rehearsal version</code> that states both versions.</td></tr>
    <tr><td>A cluster with that name already exists, for example from <code>--keep-cluster</code>.</td><td>It is reused as it is. If its version differs, the report adds the same <code>WARN</code> line.</td></tr>
    <tr><td>Your kind release cannot start the image for your version.</td><td>The result is <code>NOT CHECKED</code>. The message names the image. A newer kind release is usually the fix.</td></tr>
  </tbody>
</table></div>
<p>The warning does not change the result. A rehearsal on another version still shows that the upgrade and the rollback work, and the report says which version that was.</p>

<h2>CRDs that are installed for you</h2>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Resources in your chart</th><th>CRDs installed from</th></tr></thead>
  <tbody>
    <tr><td><code>ServiceMonitor</code>, <code>PodMonitor</code>, <code>PrometheusRule</code></td><td>Prometheus Operator v0.78.1</td></tr>
    <tr><td><code>HTTPRoute</code>, <code>Gateway</code></td><td>Gateway API v1.2.0</td></tr>
    <tr><td><code>Certificate</code>, <code>Issuer</code>, <code>ClusterIssuer</code></td><td>cert-manager v1.16.2</td></tr>
    <tr><td><code>Cluster</code> (<code>postgresql.cnpg.io</code>)</td><td>CloudNativePG v1.24.1</td></tr>
  </tbody>
</table></div>
<p>Only the CRDs are installed. The controllers behind them are not.</p>

<h2>Options</h2>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Flag</th><th>Effect</th></tr></thead>
  <tbody>
    <tr><td><code>--crd-file</code></td><td>A CRD file or URL to install before the rehearsal. Repeat it for several.</td></tr>
    <tr><td><code>--timeout</code></td><td>How long to wait for pods at each step. The default is <code>10m</code>.</td></tr>
    <tr><td><code>--helm-test</code></td><td>Also run the chart's <code>helm test</code> hooks after the upgrade.</td></tr>
    <tr><td><code>--require-rehearsal</code></td><td>If the rehearsal does not run and pass, the result is <code>NOT CHECKED</code> (exit 2) instead of <code>PASSED</code> (exit 0).</td></tr>
        <tr><td><code>--keep-cluster</code></td><td>Do not delete the cluster at the end. The next run reuses it and starts faster.</td></tr>
    <tr><td><code>--cluster-name</code></td><td>Use another name for the cluster. The default is <code>stageproof-</code> plus the process id, so two rehearsals can run at once. The name is the first line of the verdict.</td></tr>
  </tbody>
</table></div>
<p>If you give only <code>--new-chart</code>, there is nothing to upgrade from. The rehearsal installs the new chart once and skips the rollback.</p>
  </template>

  <template data-topic="large-crds" data-group="Guides" data-title="Large CRDs and server-side apply">
<p class="docs-lede">Some charts ship CRDs that are too large to apply the default way. Stageproof warns you before the deployment fails. Read this page when a report contains <code>k8s.crd.oversized_annotation_limit</code>.</p>

<dl class="doc-facts">
  <div><dt>Use it when</dt><dd>A report shows the large CRD warning, or you deploy charts such as argo-cd or kube-prometheus-stack.</dd></div>
  <div><dt>Finds</dt><dd>Every CRD in the chart that is larger than 256 KiB.</dd></div>
  <div><dt>Needs</dt><dd>Helm. No cluster.</dd></div>
</dl>

<h2>Why size matters</h2>
<p>The default way to apply a resource is client-side apply. It stores a full copy of the resource in an annotation on that resource. Kubernetes limits annotations to 256 KiB. A CRD larger than that cannot be applied this way, and the deployment fails with an error about annotations being too long.</p>
<p>Server-side apply does not use that annotation, so it has no such limit.</p>

<h2>Run the check</h2>
<pre data-kind="cmd">
stageproof check --new-chart ./argo-cd</pre>
<pre data-kind="out">
stageproof  PASSED  exit 0
compare  (single-chart check) -> ./argo-cd
k8s  1.33  ·  checked: files

  ✓ PASS  helm template            rendered 60 Kubernetes objects cleanly
  ✓ PASS  values.yaml AST          no custom -f overlay passed (default chart values verified)
  ✓ PASS  k8s 1.33 compatibility   0 blockers (2 deprecation, EOL, or CRD warnings)

  WARN  k8s.crd.oversized_annotation_limit
         CustomResourceDefinition/default/applications.argoproj.io
         CRD size is 550 KiB (>256 KiB client-side `last-applied-configuration` limit).
         1-line fixes -> Argo CD: `syncOptions: [ServerSideApply=true]` | Flux: `install/upgrade.crds: CreateReplace` | Helm v4: `helm upgrade --server-side` | kubectl: `kubectl apply --server-side -f crds/` (pass `--server-side-apply` if already enabled).
  WARN  k8s.crd.oversized_annotation_limit
         CustomResourceDefinition/default/applicationsets.argoproj.io
         CRD size is 2778 KiB (>256 KiB client-side `last-applied-configuration` limit).
         1-line fixes -> Argo CD: `syncOptions: [ServerSideApply=true]` | Flux: `install/upgrade.crds: CreateReplace` | Helm v4: `helm upgrade --server-side` | kubectl: `kubectl apply --server-side -f crds/` (pass `--server-side-apply` if already enabled).

verdict  PASSED (exit 0)  · 404ms · 0 AI calls</pre>
<p>This is a warning, so the result is not blocked. Whether the deployment fails depends on how you deploy, which Stageproof cannot see from a chart directory.</p>

<h2>What to do</h2>
<p>First, change how the tool that deploys the chart applies CRDs.</p>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>You deploy with</th><th>Setting</th></tr></thead>
  <tbody>
    <tr><td>Argo CD</td><td>Add <code>ServerSideApply=true</code> to <code>spec.syncPolicy.syncOptions</code> in the Application.</td></tr>
    <tr><td>Flux</td><td>Set <code>install.crds</code> and <code>upgrade.crds</code> to <code>CreateReplace</code>.</td></tr>
    <tr><td>Helm 4</td><td>A new install already uses server-side apply. An upgrade of a release Helm 3 created stays client-side unless you pass <code>--server-side</code>.</td></tr>
    <tr><td>kubectl</td><td>Run <code>kubectl apply --server-side -f crds/</code>.</td></tr>
  </tbody>
</table></div>
<p>Then tell Stageproof, so that it stops warning:</p>
<ul>
  <li>For a chart directory, add <code>--server-side-apply</code> to the command, or set <code>serverSideApply: true</code> in the <a href="#config">configuration file</a>.</li>
  <li>For an Argo CD Application, do nothing. Stageproof reads <code>ServerSideApply=true</code> from the file.</li>
  <li>For a Flux HelmRelease, <code>spec.upgrade.crds</code> is read for the CRD schema rule. It does not turn off this size warning. Pass <code>--server-side-apply</code> when you apply with server-side apply.</li>
</ul>
  </template>

  <template data-topic="helm4" data-group="Guides" data-title="Moving to Helm 4">
<p class="docs-lede">What changes when the helm binary is Helm 4, and what Stageproof can already see. The notes below follow <a href="https://helm.sh/docs/overview/">Helm 4 Overview</a>. The released binary is v0.3.1.</p>

<h2>What the check can decide</h2>
<p><code>Chart.yaml</code> <code>apiVersion: v3</code> is <code>helm4.chart_v3</code>, a warning. Charts v3 are experimental. v2 charts work on Helm 3 and Helm 4. <a href="https://helm.sh/docs/overview/#charts-v3">Charts v3</a>.</p>
<p><code>--helm-compare</code> renders the chart with the helm on <code>PATH</code> and with the binary you name. Objects are parsed and compared. A field that changes between two renders of the same binary is ignored. A remaining difference is <code>helm4.render_differs</code>, a warning. If one binary cannot render the chart, that is <code>helm4.render_failed</code> and the result is <code>BLOCKED</code>. <a href="https://helm.sh/docs/overview/#upgrading-to-helm-4">Upgrading to Helm 4</a> asks you to test existing charts. This is that test for the render.</p>
<p>This run used Helm 3.22.1 on <code>PATH</code> and Helm 4.3.2 as <code>--helm-compare</code>. The chart prints <code>.Capabilities.HelmVersion.Version</code>, so the objects differ:</p>
<pre data-kind="cmd">
stageproof check --api-server off --new-chart testdata/helm4/version --current-k8s 1.35 --helm-compare /tmp/helm-bins/helm4</pre>
<pre data-kind="out">
!  NOT TESTED LIVE. This job did not rehearse the upgrade. The files were checked. The upgrade itself was not.
stageproof  PASSED  exit 0
compare  (single-chart check) -> testdata/helm4/version
k8s  1.35  ·  checked: files

  ✓ PASS  helm template            rendered 1 Kubernetes object cleanly
  ✓ PASS  values.yaml AST          no custom -f overlay passed (default chart values verified)
  ✓ PASS  image tags               no new or changed image
  ! WARN  Helm 4                   the rendered objects differ
  ✓ PASS  k8s 1.35 compatibility   0 removed APIs or selector breaks on K8s 1.35

  WARN  helm4.render_differs
         ConfigMap/default/c
         helm (v3.22.1) and /tmp/helm-bins/helm4 (v4.3.2) rendered different objects for the new chart. ConfigMap/default/c at data.helm.
         Fields that change between two renders of the same binary are ignored. The report names paths and does not print values. https://helm.sh/docs/overview/#upgrading-to-helm-4

verdict  PASSED (exit 0)  · 406ms · 0 AI calls</pre>
<p>A chart both binaries render the same way stays <code>PASSED</code>, and the Helm 4 line says the two binaries rendered the same objects. The commands Stageproof runs (<code>template</code>, <code>pull</code>, <code>install</code>, <code>upgrade</code>, <code>rollback</code>, <code>uninstall</code>, <code>test</code>, <code>status</code>, and <code>version --template</code>) were checked on Helm 3.22.1 and Helm 4.3.2. Helm 4.3.2 still has <code>template</code>. It does not have a <code>render</code> command.</p>

<h2>What stays in the notes</h2>
<p>These are real Helm 4 changes. A chart file does not show them, and rendering with both binaries does not show them either.</p>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Change</th><th>Where Helm wrote it</th><th>What to do</th></tr></thead>
  <tbody>
    <tr><td>A post-renderer is a plugin name, not an executable path.</td><td><a href="https://helm.sh/docs/overview/#post-renderers-implemented-as-plugins">Post-renderers</a></td><td>Stageproof does not pass <code>--post-renderer</code>. Update a workflow that points that flag at a program.</td></tr>
    <tr><td><code>helm registry login</code> takes a registry host, not a full URL.</td><td><a href="https://helm.sh/docs/overview/#registry-login-does-not-accept-full-urls">Registry login</a></td><td>Stageproof pulls charts with <code>helm pull</code>. It does not call <code>registry login</code>.</td></tr>
    <tr><td>A new install uses server-side apply. An upgrade follows the previous apply method. A release Helm 3 created stays client-side.</td><td><a href="https://helm.sh/docs/overview/#server-side-apply">Server-side apply</a></td><td>Pass <code>--server-side-apply</code> when the release is applied that way. A check with no current chart treats a Helm 4 binary as a new install.</td></tr>
    <tr><td><code>--atomic</code> is <code>--rollback-on-failure</code>. <code>--force</code> is <code>--force-replace</code>. The old flags still run and warn.</td><td><a href="https://helm.sh/docs/overview/#cli-flags-renamed">Renamed flags</a></td><td>Stageproof does not pass either flag. On Helm 4.3.2 both old flags still print a deprecation warning.</td></tr>
    <tr><td><code>helm template --hide-notes</code> and <code>--render-subchart-notes</code> do nothing and will go away in Helm 5.</td><td><a href="https://helm.sh/docs/overview/#cli-flags-deprecated">Deprecated flags</a></td><td>Stageproof does not pass them. Helm 4.3.2 still accepts <code>--hide-notes</code> and warns.</td></tr>
    <tr><td><code>helm install --create-pods</code> and <code>helm repo add --no-update</code> are gone.</td><td><a href="https://helm.sh/docs/changelog/">Changelog</a></td><td>Helm 4.3.2 rejects both flags. Stageproof does not pass them.</td></tr>
    <tr><td>Plugin, SDK, and package paths moved. The cache can be content-addressed.</td><td><a href="https://helm.sh/docs/overview/#plugin-system-overhaul">Plugins</a> and <a href="https://helm.sh/docs/overview/#stable-sdk-api">the SDK</a></td><td>Stageproof shells out to the helm binary. It does not import the Helm SDK.</td></tr>
  </tbody>
</table></div>
  </template>


  <!-- ================================================================ CI -->

  <template data-topic="ci-gitlab" data-group="Run in CI" data-title="GitLab CI">
<p class="docs-lede">Run Stageproof on every merge request that changes a chart. The pipeline fails when the upgrade is blocked, and the report is posted as a comment on the merge request.</p>

<dl class="doc-facts">
  <div><dt>Use it when</dt><dd>Your repository is on GitLab and you want a failed check to stop a merge.</dd></div>
  <div><dt>Runs</dt><dd><a href="#pull-request"><code>stageproof check-pr</code></a> against the target branch of the merge request.</dd></div>
  <div><dt>Needs</dt><dd>A runner that can pull the Stageproof image. The image already contains Stageproof, Helm, and Git. No cluster.</dd></div>
</dl>

<h2>The job</h2>
<p>Change the paths under <code>changes</code> to where your charts and Application files are. The image tag is a released version.</p>
<pre data-kind="file" data-label=".gitlab-ci.yml">
stageproof:
  stage: test
  image:
    name: ghcr.io/stageproof/stageproof:v0.3.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: "50"
    GIT_FETCH_EXTRA_FLAGS: "--prune --quiet"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - charts/**/*
        - apps/**/*
  script:
    - |
      set -euo pipefail
      git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --depth=50
      BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"

      set +e
      STAGEPROOF_COLOR=always stageproof check-pr \
        --current-git "$BASE" \
        --current-k8s 1.35 \
        --comment-file stageproof-comment.md \
        --out stageproof-report.json
      RESULT=$?
      set -e

      # Post or update one comment. A comment failure must not hide the check result.
      POST=0
      if [ -f stageproof-comment.md ] &amp;&amp; [ -n "${STAGEPROOF_GITLAB_TOKEN:-}" ]; then
        stageproof comment --file stageproof-comment.md || POST=$?
      fi

      # 0 is PASSED or PROVEN. 1 is BLOCKED. 2 is NOT CHECKED.
      if [ "$RESULT" -ne 0 ]; then
        exit "$RESULT"
      fi
      exit "$POST"
  artifacts:
    when: always
    paths:
      - stageproof-report.json
      - stageproof-comment.md</pre>

<h2>What the job prints</h2>
<p>The job log contains the same report you get on your own machine, in color. In CI the current version is labelled with the commit hash of the target branch. Set <code>--current-k8s</code> to the Kubernetes version of the cluster you deploy to.</p>
<pre data-kind="out">
stageproof  PASSED  exit 0
compare  argo-cd@10.9.6 (483f04ab675afc42575124fe013935041e5028c8) -> argo-cd@10.18.0 (apps/argo-cd.yaml)
values  helm.values in apps/argo-cd.yaml
k8s  1.35  ·  checked: files

  ✓ PASS  helm template            rendered 60 Kubernetes objects cleanly
  ✓ PASS  values.yaml AST          2 keys: 0 proven by rendering, 2 read in templates
  ✓ PASS  k8s 1.35 compatibility   0 removed APIs or selector breaks on K8s 1.35 (SSA mode)

verdict  PASSED (exit 0)  · 4098ms · 0 AI calls</pre>

<h2>How each part works</h2>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Part</th><th>Why it is there</th></tr></thead>
  <tbody>
    <tr><td><code>rules</code></td><td>The job runs only in merge request pipelines, and only when a chart or Application file changed.</td></tr>
    <tr><td><code>GIT_DEPTH</code> and <code>git fetch</code></td><td>Stageproof reads the chart from the target branch, so that commit must be in the clone. A clone with depth 1 does not contain it.</td></tr>
    <tr><td><code>set +e</code> around the command</td><td>The job must keep running after a non-zero exit code, so that it can post the comment before it fails.</td></tr>
    <tr><td><code>stageproof comment</code></td><td>Posts the Markdown file, or updates the note that already contains <code>&lt;!-- stageproof-comment --&gt;</code>.</td></tr>
    <tr><td>The last <code>if</code></td><td>Exit code <code>0</code> is <code>PASSED</code> or <code>PROVEN</code> and the job stays green. Exit code <code>1</code> (<code>BLOCKED</code>) and <code>2</code> (<code>NOT CHECKED</code>) fail the job. That exit is kept even when the comment command fails. If the check passed and the comment did not, the job fails with the comment command's exit code.</td></tr>
  </tbody>
</table></div>

<h2>The comment on the merge request</h2>
<p><code>stageproof comment</code> posts the Markdown report, or updates the existing note that contains <code>&lt;!-- stageproof-comment --&gt;</code>. A later run does not add a second note. A merge request that changes several charts gets one comment that covers all of them.</p>
<p>It reads <code>CI_API_V4_URL</code>, <code>CI_PROJECT_ID</code>, and <code>CI_MERGE_REQUEST_IID</code>. The token is <code>STAGEPROOF_GITLAB_TOKEN</code>, <code>GITLAB_TOKEN</code>, or <code>CI_JOB_TOKEN</code>, in that order. A personal or project token uses the <code>PRIVATE-TOKEN</code> header and needs the <code>api</code> scope. A job token uses the <code>JOB-TOKEN</code> header. Mark the variable as masked. Without a token, the job still checks the merge request and skips the comment. The request goes to the host in <code>CI_API_V4_URL</code>, or to <code>https://gitlab.com/api/v4</code> when that variable is empty.</p>

<h2>Stop a blocked merge request from merging</h2>
<p>A failed job does not stop a merge by default. In the project, open <strong>Settings</strong>, then <strong>Merge requests</strong>, and turn on <strong>Pipelines must succeed</strong>.</p>
<p>GitLab applies that setting to every merge request in the project. It cannot be limited to some branches. Make sure every merge request gets a pipeline, including the ones that change no chart, or those can no longer be merged.</p>

<h2>Add the live rehearsal</h2>
<p>The job above does not use <code>--live</code>. <code>--live</code> starts a real Kubernetes node, and that node is a container that has to set up its own networking and start more containers. An unprivileged CI job is blocked from doing that, so the report says <code>NOT TESTED LIVE</code>. See <a href="#live">Rehearse the upgrade in a temporary cluster</a>.</p>
  </template>

  <template data-topic="ci-github" data-group="Run in CI" data-title="GitHub Actions">
<p class="docs-lede">Run Stageproof on every pull request that changes a chart. The workflow fails when the upgrade is blocked, and the report appears in the workflow summary.</p>

<dl class="doc-facts">
  <div><dt>Use it when</dt><dd>Your repository is on GitHub and you want a failed check to stop a merge.</dd></div>
  <div><dt>Runs</dt><dd><a href="#pull-request"><code>stageproof check-pr</code></a> against the base branch of the pull request.</dd></div>
  <div><dt>Needs</dt><dd>A GitHub-hosted Ubuntu runner. The job downloads the released binary and Helm. No cluster.</dd></div>
</dl>

<h2>Use the action</h2>
<p><a href="https://github.com/stageproof/action"><code>stageproof/action</code></a> checks out the pull request, downloads the released binary, checks <code>checksums.txt</code>, writes the report to the job summary, and posts one comment. Pin the commit. A floating <code>v1</code> tag is not published yet.</p>
<pre data-kind="file" data-label=".github/workflows/stageproof.yml">
      - uses: stageproof/action@db6a432ddaec807a9356e05c33ad302ade24803b
        with:
          current-k8s: "1.35"
          api-server: auto
          comment: "true"
          live: "false"</pre>
<p>The workflow still needs <code>on: pull_request</code> and <code>permissions: pull-requests: write</code>. Set <code>current-k8s</code> to the Kubernetes version of the cluster you deploy to. <code>live: "true"</code> rehearses the upgrade on a runner that can start containers. Do not run this action from <code>pull_request_target</code>.</p>

<h2>Install it yourself</h2>
<p>The workflow below downloads Helm and the released binary without the action. Change <code>paths</code> to where your charts and Application files are. The version in the download URL is a released tag.</p>
<pre data-kind="file" data-label=".github/workflows/stageproof.yml">
name: stageproof

on:
  pull_request:
    paths:
      - "charts/**"
      - "apps/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm 3.22.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/helm.tgz https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz
          echo "896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Install Stageproof v0.3.1
        run: |
          set -euo pipefail
          curl -fsSL -o checksums.txt https://github.com/stageproof/stageproof/releases/download/v0.3.1/checksums.txt
          curl -fsSL -o stageproof_0.3.1_linux_amd64.tar.gz https://github.com/stageproof/stageproof/releases/download/v0.3.1/stageproof_0.3.1_linux_amd64.tar.gz
          sha256sum -c checksums.txt --ignore-missing
          tar -xzf stageproof_0.3.1_linux_amd64.tar.gz
          sudo mv stageproof /usr/local/bin/stageproof

      - name: Check the pull request
        run: |
          set +e
          stageproof check-pr \
            --current-git "origin/${{ github.base_ref }}" \
            --current-k8s 1.35 \
            --comment-file stageproof-comment.md \
            --out stageproof-report.json
          result=$?
          set -e

          if [ -f stageproof-comment.md ]; then
            cat stageproof-comment.md &gt;&gt; "$GITHUB_STEP_SUMMARY"
          fi

          # Post or update one pull request comment. A fork token is often read-only.
          post=0
          if [ -f stageproof-comment.md ]; then
            stageproof comment --file stageproof-comment.md --best-effort || post=$?
          fi

          # 0 is PASSED or PROVEN. 1 is BLOCKED. 2 is NOT CHECKED.
          if [ "$result" -ne 0 ]; then
            exit "$result"
          fi
          exit "$post"</pre>

<h2>How each part works</h2>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Part</th><th>Why it is there</th></tr></thead>
  <tbody>
    <tr><td><code>paths</code></td><td>The workflow runs only when a chart or Application file changed.</td></tr>
    <tr><td><code>fetch-depth: 0</code></td><td>Stageproof reads the chart from the base branch, so that branch must be in the clone. The default checkout does not contain it.</td></tr>
    <tr><td><code>origin/${{ github.base_ref }}</code></td><td>The branch the pull request will merge into.</td></tr>
    <tr><td><code>GITHUB_STEP_SUMMARY</code></td><td>The Markdown report is added to the summary page of the workflow run.</td></tr>
    <tr><td><code>pull-requests: write</code></td><td><code>stageproof comment</code> uses <code>GITHUB_TOKEN</code> to post or update one comment on <code>api.github.com</code>. A fork pull request often has a read-only token. <code>--best-effort</code> leaves the job green in that case.</td></tr>
    <tr><td>The last <code>if</code></td><td>Exit code <code>0</code> is <code>PASSED</code> or <code>PROVEN</code>. Exit code <code>1</code> and <code>2</code> fail the workflow. The summary is written first. The check exit code is kept when the comment command also fails.</td></tr>
  </tbody>
</table></div>
<p>Set <code>--current-k8s</code> to the Kubernetes version of the cluster you deploy to.</p>

<h2>Stop a blocked pull request from merging</h2>
<p>Add a branch protection rule, or a ruleset, for your default branch. Require status checks to pass, and select the <code>check</code> job of this workflow.</p>
  </template>

  <template data-topic="renovate" data-group="Run in CI" data-title="Use with Renovate">
<p class="docs-lede">Renovate opens pull requests that bump chart versions. Stageproof checks each of those pull requests. The two tools do not talk to each other, and neither needs to know about the other.</p>

<dl class="doc-facts">
  <div><dt>Use it when</dt><dd>Renovate, or a similar bot, opens version bump pull requests in a repository with charts.</dd></div>
  <div><dt>How it fits</dt><dd>Renovate changes a file and opens a pull request. Your pipeline starts. Stageproof reads the diff.</dd></div>
  <div><dt>Needs</dt><dd>Stageproof in your pipeline: <a href="#ci-gitlab">GitLab CI</a> or <a href="#ci-github">GitHub Actions</a>.</dd></div>
</dl>

<h2>1. Let Renovate find your chart versions</h2>
<p>Renovate updates a version only when it knows where the version is written. For Argo CD Application files, turn on the <code>argocd</code> manager and tell it which files to read.</p>
<pre data-kind="file" data-label="renovate.json">
{
  "$schema": "https://docs.renovatebot.com/renovate-schema.json",
  "extends": ["config:recommended"],
  "enabledManagers": ["argocd"],
  "argocd": {
    "managerFilePatterns": ["/^apps/.+\\.yaml$/"]
  },
  "automerge": false
}</pre>
<p>With this file, Renovate opens a pull request when a chart has a newer version. The pull request changes <code>targetRevision</code> in the Application file. Stageproof then compares the two versions, as shown in <a href="#argocd">Check an Argo CD Application</a>.</p>

<h2>2. Do not merge before the check has run</h2>
<p>Keep <code>automerge</code> off, or protect your default branch so that a pull request cannot merge while the Stageproof job is failing. The CI pages show the setting for each platform.</p>

<h2>3. On GitLab, avoid a second pipeline for each branch</h2>
<p>Renovate pushes a branch and then opens a merge request. GitLab can start one pipeline for the push and another for the merge request. Only the merge request pipeline runs Stageproof. This rule in the root <code>.gitlab-ci.yml</code> skips the other one.</p>
<pre data-kind="file" data-label=".gitlab-ci.yml">
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" &amp;&amp; $CI_COMMIT_BRANCH =~ /^renovate\//
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG</pre>

<h2>What Stageproof can and cannot say about an image update</h2>
<p>Renovate also bumps container image tags in <code>values.yaml</code>. For such a pull request, Stageproof renders the chart with the new tag and asks the registry whether that tag exists. It does not download the image layers, so it cannot tell whether the new image starts.</p>
<p>A tag the registry says is missing is <code>BLOCKED</code>. A tag the registry has is <code>PASSED</code>, with the image warning that names the change. To have the new image started in a cluster, use the <a href="#live">live rehearsal</a>.</p>
  </template>

  <!-- ================================================================ REFERENCE -->

  <template data-topic="cli" data-group="Reference" data-title="Commands and flags">
<p class="docs-lede">Every command and every flag in the source on main. The released binary is v0.3.1.</p>

<h2>Commands</h2>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Command</th><th>What it does</th></tr></thead>
  <tbody>
    <tr><td><code>stageproof check</code></td><td>Checks one chart, two versions from a Helm repository or an OCI registry, one Argo CD Application, one Flux HelmRelease, or two sets of rendered manifests.</td></tr>
    <tr><td><code>stageproof check-pr</code></td><td>Finds the charts, Applications, and Flux HelmReleases that a branch changed, and checks each one.</td></tr>
    <tr><td><code>stageproof init</code></td><td>Writes a starter configuration file.</td></tr>
    <tr><td><code>stageproof explain &lt;rule-id&gt;</code></td><td>Prints the level, the meaning, and what to do for one rule. An unknown id exits 2. See <a href="#findings">Findings</a>.</td></tr>
    <tr><td><code>stageproof fetch-apiserver</code></td><td>Downloads <code>kube-apiserver</code>, <code>etcd</code>, and <code>kubectl</code> for one Kubernetes minor into a directory.</td></tr>
    <tr><td><code>stageproof facts export</code></td><td>Writes cluster facts as JSON. <code>get</code> and <code>list</code> only. See <a href="#cluster-facts">Read a cluster</a>.</td></tr>
    <tr><td><code>stageproof comment</code></td><td>Posts the Markdown file from <code>--comment-file</code>, or updates the comment that already contains the marker.</td></tr>
    <tr><td><code>stageproof mcp</code></td><td>Serves <code>check</code>, <code>check_pr</code>, and <code>explain</code> on stdin and stdout. Paths stay inside <code>--root</code>. It does not open a port.</td></tr>
    <tr><td><code>stageproof version</code></td><td>Prints the version.</td></tr>
    <tr><td><code>stageproof help</code></td><td>Prints the list of commands and flags.</td></tr>
  </tbody>
</table></div>

<h2><code>stageproof check</code>: what to compare</h2>
<p>Give <code>--new-chart</code>, <code>--repo</code>, <code>--argocd-file</code>, <code>--flux-file</code>, or both <code>--before</code> and <code>--after</code>. Without one of those the command ends with exit code <code>2</code>.</p>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Flag</th><th>Meaning</th></tr></thead>
  <tbody>
    <tr><td><code>--new-chart &lt;dir&gt;</code></td><td>The chart you want to deploy.</td></tr>
    <tr><td><code>--current-chart &lt;dir&gt;</code></td><td>The chart you run today. Leave it out to check the new chart on its own.</td></tr>
    <tr><td><code>--repo &lt;url&gt;</code></td><td>An <code>http://</code> or <code>https://</code> Helm repository, or an <code>oci://</code> registry. Requires <code>--chart</code>, <code>--from</code>, and <code>--to</code>. Stageproof downloads both versions, checks the upgrade, and deletes the temporary directories. A failed download is exit 2. <code>--offline</code> does not skip the download.</td></tr>

<h2><code>stageproof comment</code></h2>
<p>Reads the Markdown file written by <code>--comment-file</code> and posts it on the pull request or merge request. A later run updates the comment that contains the marker. The default marker is <code>&lt;!-- stageproof-comment --&gt;</code>. The command exits 0 when the comment is written. It exits 2 when the file, the token, or the permission is missing. That exit code is not an upgrade verdict. Keep the exit code from <code>check</code> or <code>check-pr</code> and run this command after it. <code>--best-effort</code> exits 0 on HTTP 403.</p>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Flag</th><th>Default</th><th>Meaning</th></tr></thead>
  <tbody>
    <tr><td><code>--file &lt;file&gt;</code></td><td>Required</td><td>The Markdown file from <code>--comment-file</code>.</td></tr>
    <tr><td><code>--provider auto|github|gitlab</code></td><td><code>auto</code></td><td><code>auto</code> uses GitHub when <code>GITHUB_ACTIONS</code> is <code>true</code>, and GitLab when <code>GITLAB_CI</code> is <code>true</code>.</td></tr>
    <tr><td><code>--pr &lt;number&gt;</code></td><td>The Actions event</td><td>GitHub pull request number. Otherwise <code>GITHUB_EVENT_PATH</code> or <code>refs/pull/&lt;number&gt;/merge</code> in <code>GITHUB_REF</code>.</td></tr>
    <tr><td><code>--mr &lt;iid&gt;</code></td><td><code>CI_MERGE_REQUEST_IID</code></td><td>GitLab merge request iid.</td></tr>
    <tr><td><code>--repo &lt;owner/name&gt;</code></td><td><code>GITHUB_REPOSITORY</code> or <code>CI_PROJECT_ID</code></td><td>GitHub <code>owner/name</code>, or a GitLab project id or <code>group/project</code> path.</td></tr>
    <tr><td><code>--marker &lt;text&gt;</code></td><td><code>&lt;!-- stageproof-comment --&gt;</code></td><td>The text that identifies the comment this command updates. One line, at most 200 characters.</td></tr>
    <tr><td><code>--best-effort</code></td><td>Off</td><td>Exit 0 when the server returns HTTP 403. The default exit is 2, and the message names the missing permission.</td></tr>
  </tbody>
</table></div>
<p>GitHub calls <code>api.github.com</code>, or the host in <code>GITHUB_API_URL</code>. The token is <code>GITHUB_TOKEN</code>. GitLab calls the host in <code>CI_API_V4_URL</code>, or <code>https://gitlab.com/api/v4</code>. The token is <code>STAGEPROOF_GITLAB_TOKEN</code>, then <code>GITLAB_TOKEN</code>, then <code>CI_JOB_TOKEN</code>. A job token is sent as <code>JOB-TOKEN</code>. The others are sent as <code>PRIVATE-TOKEN</code>. The token is not printed. The command does not follow a redirect to another host.</p>

<h2><code>stageproof mcp</code></h2>
<p>Speaks the Model Context Protocol on stdin and stdout. Logs go to stderr. The process does not open a port.</p>
<p>The tools are <code>check</code>, <code>check_pr</code>, and <code>explain</code>. <code>check</code> returns the same JSON report as <code>--format json</code>. <code>check_pr</code> returns the combined JSON that <code>check-pr --format json</code> writes. <code>explain</code> returns the rule id, level, title, meaning, and fix. Every path is relative to <code>--root</code>. An absolute path, a path that leaves that directory, or a symlink that points outside it is rejected. <code>live</code>, <code>out</code>, and <code>comment_file</code> are rejected. <code>api_server</code> defaults to <code>off</code>, so a tool call does not download an API server unless the caller sets <code>auto</code> or <code>require</code>. A check uses the same chart, registry, and API server hosts as <code>stageproof check</code>.</p>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Flag</th><th>Default</th><th>Meaning</th></tr></thead>
  <tbody>
    <tr><td><code>--root &lt;dir&gt;</code></td><td><code>.</code></td><td>The only directory the tools may read. A missing directory exits 2.</td></tr>
  </tbody>
</table></div>
<p>The process exits 0 when the client closes stdin. It exits 2 when <code>--root</code> cannot be read.</p>

  <template data-topic="config" data-group="Reference" data-title="Configuration file">
<p class="docs-lede">Settings that should apply to every check can go in a file named <code>.stageproof.yaml</code>. The file is optional.</p>

<h2>Where the file goes</h2>
<p><code>stageproof check</code> reads <code>.stageproof.yaml</code> from the directory in which you run the command. In a repository, put it in the top directory and run Stageproof from there. <code>stageproof check-pr</code> reads that file from <code>--current-git</code>, the branch the pull request merges into. It does not read the copy in the pull request. If the pull request changes the file, the report includes <code>config.changed_in_pr</code>. An ignore added only on the branch does not hide a finding.</p>

<h2>The settings</h2>
<pre data-kind="file" data-label=".stageproof.yaml">
currentKubernetes: "1.35"
nextKubernetes: "1.36"
serverSideApply: true
liveTest: false
crdFiles:
  - https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.crds.yaml
charts:
  - name: webapp
    path: charts/webapp
    valuesFiles:
      - charts/webapp/values-prod.yaml
      - charts/webapp/values.yaml</pre>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Setting</th><th>Meaning</th><th>How file and flag combine</th></tr></thead>
  <tbody>
    <tr><td><code>currentKubernetes</code></td><td>The Kubernetes version your cluster runs. Same as <code>--current-k8s</code>.</td><td>The file is used when the flag is not given.</td></tr>
    <tr><td><code>nextKubernetes</code></td><td>The Kubernetes version you plan to upgrade the cluster to. Same as <code>--next-k8s</code>.</td><td>The file is used when the flag is not given.</td></tr>
    <tr><td><code>serverSideApply</code></td><td>You deploy with server-side apply. Same as <code>--server-side-apply</code>.</td><td><code>true</code> in the file turns it on. A flag cannot turn it off.</td></tr>

    <tr><td><code>crdFiles</code></td><td>CRDs to install before a live rehearsal. Same as <code>--crd-file</code>.</td><td>The file is used when the flag is not given.</td></tr>

<h2>Create a starter file</h2>
<p>Run this in the top directory of the repository.</p>
<pre data-kind="cmd">
stageproof init</pre>
<pre data-kind="out">
Wrote .stageproof.yaml (discovered 2 Helm charts, currentKubernetes=1.33, nextKubernetes=1.34)</pre>
<p>The command finds every chart in the repository and the values files next to it, and writes them to <code>.stageproof.yaml</code>:</p>
<pre data-kind="file" data-label=".stageproof.yaml written by stageproof init">
# Written by `stageproof init`. Settings for `stageproof check` and `stageproof check-pr`.
currentKubernetes: "1.33"
nextKubernetes: "1.34"
liveTest: false
charts:
    - name: billing
      path: charts/billing
      valuesFiles:
        - charts/billing/values.yaml
    - name: webapp
      path: charts/webapp
      valuesFiles:
        - charts/webapp/values-prod.yaml
        - charts/webapp/values.yaml</pre>
<p>The two Kubernetes versions are placeholders. Change <code>currentKubernetes</code> to the version your cluster runs, and <code>nextKubernetes</code> to the version you plan to move to, or delete that line.</p>
<p>Subcharts inside a chart's own <code>charts</code> directory are not listed. They are checked as part of their parent chart.</p>
<p>A chart whose version lives in another file, rather than in an Application manifest, is listed under <code>applications</code>. <code>versionFrom.regex</code> must capture the version. <code>templatePlaceholders</code> replaces <code>${...}</code> tokens. A token left in the chart repository, name, or version makes the result <code>NOT CHECKED</code> and names the token. A token left anywhere else is replaced with <code>stageproof-placeholder</code>, and the report says a placeholder was used.</p>
  </template>

  <template data-topic="findings" data-group="Reference" data-title="Findings">
<p class="docs-lede">Every rule that can appear in a report, what it means, and what to do about it. An <code>ERROR</code> makes the result <code>BLOCKED</code>. A <code>WARN</code> does not change the result. <code>stageproof explain</code> prints the same text for one rule.</p>
<pre data-kind="cmd">
stageproof explain helm.values.silently_dropped</pre>
<pre data-kind="out">

What to do
Rename the key to what the new chart uses, or remove it.</pre>

<h2>Image tags</h2>
<p>For each image that is new or whose reference changed, Stageproof sends HTTP <code>HEAD</code> to the registry named in that reference. It does not download layers. A manifest list is fetched only to see whether <code>linux/amd64</code> is present. One request waits 5 seconds. The whole check waits 20 seconds. At most four requests run at once for one registry host. <code>--offline</code> sends nothing. It does not change <code>--api-server</code>. An unchanged tag is not asked.</p>

<h2>Impact</h2>
<p>These compare the current objects with the new ones. Lists of containers, env, ports, and volumes are matched by name. RBAC rules are compared as a set. When the API server returned a stored form for both sides, that form is what is compared. Otherwise the check says it used the rendered objects.</p>

    <tr><td><code>impact.delete.pvc</code></td><td><span class="verdict-badge bad">ERROR</span></td><td>A PersistentVolumeClaim is dropped. The data on that claim goes with it. The keep annotation suppresses this.</td><td>Keep the claim in the chart, or copy the data first.</td></tr>

<h2>When a live rehearsal does not finish</h2>
<p>A check you run without <code>--live</code> does not warn about that. The result is <code>PASSED</code> and the report says <code>checked: files</code>. These reasons appear only when <code>--live</code> was set and the rehearsal stopped before it could judge the upgrade. The result stays <code>PASSED</code> unless you also set <code>--require-rehearsal</code>, which makes it <code>NOT CHECKED</code>.</p>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Reason</th><th>Meaning</th><th>What to do</th></tr></thead>
  <tbody>
    <tr><td><code>rehearsal_required</code></td><td><code>--require-rehearsal</code> is set and no rehearsal ran.</td><td>Add <code>--live</code>, or remove the requirement.</td></tr>
    <tr><td><code>missing_external_crds</code></td><td>The chart needs a CRD that Stageproof could not install.</td><td>Pass the CRD with <code>--crd-file</code>.</td></tr>
    <tr><td><code>baseline_requires_external_dependency</code></td><td>The current chart cannot start in an empty cluster, because it needs something from outside it.</td><td>Check with values that work in an empty cluster, for example a public image and no external database.</td></tr>
    <tr><td><code>head_requires_external_dependency</code></td><td>The same, when you check a new chart on its own.</td><td>The same.</td></tr>
  </tbody>
</table></div>

<p class="docs-lede">What the source on main covers, what it leaves out, and where a passing result says less than you might expect. The released binary is v0.3.1.</p>

<h2>What is not supported</h2>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Not supported</th><th>What that means for you</th></tr></thead>
  <tbody>
    <tr><td>Terraform providers and modules</td><td>A change to a provider version or a module version is not checked.</td></tr>
    <tr><td>Container image contents</td><td>Stageproof does not inspect image layers. A new or changed tag is asked of its registry. A new image is started only in the <a href="#live">live rehearsal</a>.</td></tr>
    <tr><td>Kustomize and Helmfile</td><td>These files are ignored. A loose manifest is ignored by <code>check-pr</code>. Two rendered trees can be compared with <a href="#manifests"><code>--before</code> and <code>--after</code></a>.</td></tr>
    <tr><td>A Flux HelmRelease whose chart is not in this checkout</td><td>A GitRepository on another host, <code>ExternalArtifact</code>, a Bucket, both <code>spec.chart</code> and <code>spec.chartRef</code>, or a missing chart <code>valuesFiles</code> entry is <code>NOT CHECKED</code>. Stageproof does not clone that repository and does not render chart defaults in its place. See <a href="#flux">Check a Flux HelmRelease</a>.</td></tr>
    <tr><td>An ApplicationSet, a chart or values file in another Git repository, or a <code>ref</code> source that also sets <code>path</code></td><td><code>NOT CHECKED</code>. Stageproof does not clone that repository, does not expand generators, and does not render chart defaults in their place. See <a href="#argocd">Check an Argo CD Application</a>.</td></tr>
    <tr><td>Application dependencies, for example npm or Maven packages</td><td>Not checked.</td></tr>
  </tbody>
</table></div>

<h2>What a passing result does not cover</h2>
<ul>
  <li><strong><code>PASSED</code> is about files.</strong> Nothing was started. The chart renders, your values are still used, and no rule found a problem. Whether the new version runs is not known.</li>
  <li><strong><code>PROVEN</code> is about an empty cluster.</strong> The temporary cluster has no production data, no traffic, and none of the other workloads in your real cluster. The rehearsal shows that the upgrade and the rollback work mechanically.</li>
  <li><strong>The temporary cluster may run another Kubernetes version than yours.</strong> That happens when kind has no image for your version. The report then says which version the rehearsal ran on.</li>
  <li><strong>The API check uses a local API server when the binaries are available.</strong> Deprecations still come from the table in <a href="#cluster-version">Check against your Kubernetes version</a>. <code>--api-server off</code> uses only that table. APIs added by CRDs are not judged by the removal table.</li>
  <li><strong>A restart is not a failure.</strong> The report names the field that changed. The result stays <code>PASSED</code> when nothing else is blocked.</li>
  <li><strong>The values check proves whether a key changes the render.</strong> Keys the template reader cannot decide are render-tested. <code>--values-proof full</code> render-tests every key. It does not know whether the application uses the rendered value correctly at runtime.</li>
  <li><strong>A pull request check covers the values files it knows about.</strong> Without a <code>charts</code> list in the configuration file, a chart in your repository is checked with its own <code>values.yaml</code> only. See <a href="#values-files">Check each values file of a chart</a>.</li>
</ul>
<p>Measured accuracy on 12 active incidents and 316 CNCF upgrade pairs across 105 CNCF projects is published in <a href="https://github.com/stageproof/stageproof/blob/main/docs/accuracy.md">docs/accuracy.md</a>.</p>

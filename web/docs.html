  <template data-topic="config" data-group="Reference" data-title="Configuration file">
<p class="docs-lede">Settings that should apply to every check can go in a file named <code>.stageproof.yaml</code>. The file is optional.</p>

<h2>Where the file goes</h2>
<p>Stageproof reads <code>.stageproof.yaml</code> from the directory in which you run the command. In a repository, put it in the top directory and run Stageproof from there. Both <code>stageproof check</code> and <code>stageproof check-pr</code> read it.</p>

<h2>The settings</h2>
<pre data-kind="file" data-label=".stageproof.yaml">
currentKubernetes: "1.35"
nextKubernetes: "1.36"
serverSideApply: true
liveTest: false
crdFiles:
  - https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.crds.yaml
charts:
  - name: webapp
    path: charts/webapp
    valuesFiles:
      - charts/webapp/values-prod.yaml
      - charts/webapp/values.yaml</pre>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Setting</th><th>Meaning</th><th>How file and flag combine</th></tr></thead>
  <tbody>
    <tr><td><code>currentKubernetes</code></td><td>The Kubernetes version your cluster runs. Same as <code>--current-k8s</code>.</td><td>The file is used when the flag is not given.</td></tr>
    <tr><td><code>nextKubernetes</code></td><td>The Kubernetes version you plan to upgrade the cluster to. Same as <code>--next-k8s</code>.</td><td>The file is used when the flag is not given.</td></tr>
    <tr><td><code>serverSideApply</code></td><td>You deploy with server-side apply. Same as <code>--server-side-apply</code>.</td><td><code>true</code> in the file turns it on. A flag cannot turn it off.</td></tr>
    <tr><td><code>liveTest</code></td><td>Rehearse every check in a temporary cluster. Same as <code>--live</code>.</td><td><code>true</code> in the file turns it on. A flag cannot turn it off.</td></tr>
    <tr><td><code>requireRehearsal</code></td><td>A check that was not rehearsed is <code>NOT CHECKED</code> (exit 2) instead of <code>PASSED</code>. Same as <code>--require-rehearsal</code>.</td><td><code>true</code> in the file turns it on. Passing the flag does the same.</td></tr>
    <tr><td><code>crdFiles</code></td><td>CRDs to install before a live rehearsal. Same as <code>--crd-file</code>.</td><td>The file is used when the flag is not given.</td></tr>
    <tr><td><code>charts</code></td><td>The values files of each chart. Used by <code>stageproof check-pr</code>. See <a href="#values-files">Check each values file of a chart</a>.</td><td>There is no flag for it.</td></tr>
  </tbody>
</table></div>
<p>Every setting is optional. Leave out the ones you do not need.</p>

<h2>Create a starter file</h2>
<p>Run this in the top directory of the repository.</p>
<pre data-kind="cmd">
stageproof init</pre>
<pre data-kind="out">
Wrote .stageproof.yaml (discovered 2 Helm charts, currentKubernetes=1.33, nextKubernetes=1.34)</pre>
<p>The command finds every chart in the repository and the values files next to it, and writes them to <code>.stageproof.yaml</code>:</p>
<pre data-kind="file" data-label=".stageproof.yaml written by stageproof init">
# Written by `stageproof init`. Settings for `stageproof check` and `stageproof check-pr`.
currentKubernetes: "1.33"
nextKubernetes: "1.34"
liveTest: false
charts:
    - name: billing
      path: charts/billing
      valuesFiles:
        - charts/billing/values.yaml
    - name: webapp
      path: charts/webapp
      valuesFiles:
        - charts/webapp/values-prod.yaml
        - charts/webapp/values.yaml</pre>
<p>The two Kubernetes versions are placeholders. Change <code>currentKubernetes</code> to the version your cluster runs, and <code>nextKubernetes</code> to the version you plan to move to, or delete that line.</p>
<p>Subcharts inside a chart's own <code>charts</code> directory are not listed. They are checked as part of their parent chart.</p>
<p>A chart whose version lives in another file, rather than in an Application manifest, is listed under <code>applications</code>. <code>versionFrom.regex</code> must capture the version. <code>templatePlaceholders</code> replaces <code>${...}</code> tokens. A token left in the chart repository, name, or version makes the result <code>NOT CHECKED</code> and names the token. A token left anywhere else is replaced with <code>stageproof-placeholder</code>, and the report says a placeholder was used.</p>
  </template>

  <template data-topic="findings" data-group="Reference" data-title="Findings">
<p class="docs-lede">Every rule that can appear in a report, what it means, and what to do about it. An <code>ERROR</code> makes the result <code>BLOCKED</code>. A <code>WARN</code> does not change the result.</p>

<h2>Values</h2>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Rule</th><th>Level</th><th>Meaning</th><th>What to do</th></tr></thead>
  <tbody>
    <tr><td><code>helm.values.silently_dropped</code></td><td><span class="verdict-badge bad">ERROR</span></td><td>A key in your values file was used by the current chart and is not used by the new chart. When you check a chart on its own, it means the chart does not use the key at all.</td><td>Rename the key to what the new chart uses, or remove it.</td></tr>
    <tr><td><code>helm.values.preexisting_orphan</code></td><td><span class="verdict-badge warn">WARN</span></td><td>A key in your values file is not used by the current chart and not by the new one.</td><td>Remove the key when convenient. The upgrade did not cause this.</td></tr>
    <tr><td><code>helm.values.new_required_unset</code></td><td><span class="verdict-badge bad">ERROR</span></td><td>The new chart requires a value that the current chart did not require, and you do not set it.</td><td>Set the value in your values file or with <code>--set</code>.</td></tr>
    <tr><td><code>helm.values.parse_error</code></td><td><span class="verdict-badge bad">ERROR</span></td><td>A values file or a chart could not be read.</td><td>Fix the file that the message names.</td></tr>
  </tbody>
</table></div>
<p>A value that the current chart already required, and that you set at deploy time and not in a file, does not block the check. Stageproof fills in a placeholder for it and reports that on a <code>WARN</code> line named <code>required values shim</code>.</p>

<h2>Rendering</h2>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Rule</th><th>Level</th><th>Meaning</th><th>What to do</th></tr></thead>
  <tbody>
    <tr><td><code>helm.template.render_failed</code></td><td><span class="verdict-badge bad">ERROR</span></td><td><code>helm template</code> failed on the new chart with your values.</td><td>Read the Helm error in the report and fix the chart or the values.</td></tr>
    <tr><td><code>helm.template.invalid_yaml</code></td><td><span class="verdict-badge bad">ERROR</span></td><td>The new chart rendered, and the output is not valid YAML.</td><td>Fix the template that produces the invalid output.</td></tr>
  </tbody>
</table></div>

<h2>What changed between the two charts</h2>
<p>These are warnings. The result stays <code>PASSED</code> when nothing else is blocked. They name the change. They do not decide that the project forbids it, and they do not contact a registry.</p>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Rule</th><th>Level</th><th>Meaning</th><th>What to do</th></tr></thead>
  <tbody>
    <tr><td><code>helm.release.version_span</code></td><td><span class="verdict-badge warn">WARN</span></td><td>The chart version skips more than one minor version, or moves to a new major version.</td><td>Read that project's upgrade notes before merging.</td></tr>
    <tr><td><code>helm.release.app_version_changed</code></td><td><span class="verdict-badge warn">WARN</span></td><td><code>appVersion</code> in <code>Chart.yaml</code> changed. The image the chart runs often changes with it.</td><td>Confirm the application version is the one you meant to run.</td></tr>
    <tr><td><code>helm.image.changed</code></td><td><span class="verdict-badge warn">WARN</span></td><td>An image in the render changed. That includes a container image, an <code>image</code> field on a custom resource, and an image passed as a container argument. A tag that only gains or loses a leading <code>v</code> is named.</td><td>Confirm the tag exists and is the tag you intended.</td></tr>
    <tr><td><code>helm.operator.existing_custom_resources</code></td><td><span class="verdict-badge warn">WARN</span></td><td>The chart ships custom resource definitions and the application it runs is changing. Existing custom resources are not in this check.</td><td>Plan the upgrade of the objects that already exist. A rehearsal uses an empty cluster.</td></tr>
    <tr><td><code>helm.operator.documented_upgrade_behavior</code></td><td><span class="verdict-badge warn">WARN</span></td><td>The chart uses a custom resource group whose project documents an upgrade effect. The note and the source URL come from <code>internal/knowledge/operators.yaml</code>. <code>helm.operator.primary_restart</code> is the same note for one release.</td><td>Read the source named in the report. A rehearsal uses an empty cluster.</td></tr>
    <tr><td><code>helm.config.placeholder_used</code></td><td><span class="verdict-badge slate">INFO</span></td><td>A <code>${...}</code> token outside the chart repository, name, or version had no entry in <code>templatePlaceholders</code>. It was replaced with <code>stageproof-placeholder</code>.</td><td>Add the token to <code>templatePlaceholders</code> when the real value matters.</td></tr>
    <tr><td><code>helm.config.unresolved_placeholder</code></td><td><span class="verdict-badge warn">WARN</span></td><td>A <code>${...}</code> token is still in the chart repository, name, or version. The result is <code>NOT CHECKED</code> and the report names the token.</td><td>Set that token in <code>templatePlaceholders</code>.</td></tr>
    <tr><td><code>helm.dependency.not_updated</code></td><td><span class="verdict-badge warn">WARN</span></td><td>A <code>Chart.yaml</code> dependency constraint changed, and the packaged chart under <code>charts/</code> did not.</td><td>Run <code>helm dependency update</code> so the render uses the new chart.</td></tr>
  </tbody>
</table></div>
<p>Argo CD <code>helm.parameters</code> and <code>--set</code> are written into a values file named <code>helm.parameters</code> before the values check. A parameter key the new chart no longer reads is <code>helm.values.silently_dropped</code>.</p>

<h2>Kubernetes</h2>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Rule</th><th>Level</th><th>Meaning</th><th>What to do</th></tr></thead>
  <tbody>
    <tr><td><code>k8s.api.removed</code></td><td><span class="verdict-badge bad">ERROR</span></td><td>A resource uses an API version that the Kubernetes version in <code>--current-k8s</code> has removed.</td><td>Move the resource to the API version named in the report.</td></tr>
    <tr><td><code>k8s.api.eol_blocker</code></td><td><span class="verdict-badge warn">WARN</span></td><td>A resource uses an API version that works today and is removed in the version in <code>--next-k8s</code>.</td><td>Migrate the resource before you upgrade the cluster.</td></tr>
    <tr><td><code>k8s.api.deprecated</code></td><td><span class="verdict-badge warn">WARN</span></td><td>A resource uses an API version that is deprecated on the version in <code>--current-k8s</code>.</td><td>Plan the migration. The report names the version in which the API is removed.</td></tr>
    <tr><td><code>k8s.upgrade.immutable_selector_changed</code></td><td><span class="verdict-badge bad">ERROR</span></td><td>The label selector of a Deployment, StatefulSet, or DaemonSet differs between the current and the new chart. Kubernetes does not allow that change on an existing workload.</td><td>Keep the selector as it was, or plan to delete and recreate the workload.</td></tr>
    <tr><td><code>k8s.apply.immutable_field</code></td><td><span class="verdict-badge bad">ERROR</span></td><td>The local API server rejected an update. The report names the field. A Job pod template and a StatefulSet <code>volumeClaimTemplates</code> change are this rule. A Helm hook is dry-run as a create, not as an update.</td><td>Keep the field, or plan to delete and recreate the object. On <code>--next-k8s</code> the same rejection is a warning.</td></tr>
    <tr><td><code>k8s.apply.unknown_field</code></td><td><span class="verdict-badge warn">WARN</span></td><td>The object has a field the schema does not declare. Helm 3.22.1 drops it and the upgrade succeeds. Helm 4.3.2 server-side apply rejects the upgrade, and so does <code>--server-side-apply</code>. Those two cases are <code>ERROR</code>.</td><td>Remove the field, or keep it only if your apply path drops unknown fields.</td></tr>
    <tr><td><code>k8s.apply.invalid</code></td><td><span class="verdict-badge bad">ERROR</span></td><td>The API server rejected the object. The report includes the server's message. On <code>--next-k8s</code> this is a warning.</td><td>Change the object so that Kubernetes version accepts it.</td></tr>
    <tr><td><code>crd.existing_object_invalid</code></td><td><span class="verdict-badge bad">ERROR</span></td><td>An object stored from the current chart does not match the new CRD schema.</td><td>Keep the stored object valid, or plan a migration before the upgrade.</td></tr>
    <tr><td><code>k8s.apply.not_exercised</code></td><td><span class="verdict-badge slate">INFO</span></td><td>A webhook configuration, an APIService, or an object the server could not judge was not sent. Sending a webhook configuration would make later requests fail.</td><td>Nothing, unless you needed that object judged. It is not a failure.</td></tr>
    <tr><td><code>k8s.crd.oversized_annotation_limit</code></td><td><span class="verdict-badge warn">WARN</span></td><td>A CRD in the chart is larger than 256 KiB.</td><td>See <a href="#large-crds">Large CRDs and server-side apply</a>.</td></tr>
  </tbody>
</table></div>

<h2>Live rehearsal</h2>
<p>These appear only with <code>--live</code>.</p>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Rule</th><th>Level</th><th>Meaning</th></tr></thead>
  <tbody>
    <tr><td><code>helm.runtime.upgrade_failed</code></td><td><span class="verdict-badge bad">ERROR</span></td><td>The current chart was healthy, and <code>helm upgrade</code> to the new chart failed.</td></tr>
    <tr><td><code>helm.runtime.pod_restarts</code></td><td><span class="verdict-badge bad">ERROR</span></td><td>The upgrade finished, and afterwards a pod was not ready or a container had restarted.</td></tr>
    <tr><td><code>helm.runtime.rollback_failed</code></td><td><span class="verdict-badge bad">ERROR</span></td><td><code>helm rollback</code> to the first revision failed.</td></tr>
    <tr><td><code>helm.runtime.helm_test_failed</code></td><td><span class="verdict-badge bad">ERROR</span></td><td>The chart's <code>helm test</code> hooks failed after the upgrade. Only with <code>--helm-test</code>.</td></tr>
    <tr><td><code>helm.crd.upgrade_failed</code></td><td><span class="verdict-badge bad">ERROR</span></td><td>The CRDs in the new chart's <code>crds</code> directory could not be applied to the cluster.</td></tr>
  </tbody>
</table></div>

<h2>When a live rehearsal does not finish</h2>
<p>A check you run without <code>--live</code> does not warn about that. The result is <code>PASSED</code> and the report says <code>checked: files</code>. These reasons appear only when <code>--live</code> was set and the rehearsal stopped before it could judge the upgrade. The result stays <code>PASSED</code> unless you also set <code>--require-rehearsal</code>, which makes it <code>NOT CHECKED</code>.</p>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Reason</th><th>Meaning</th><th>What to do</th></tr></thead>
  <tbody>
    <tr><td><code>rehearsal_required</code></td><td><code>--require-rehearsal</code> is set and no rehearsal ran.</td><td>Add <code>--live</code>, or remove the requirement.</td></tr>
    <tr><td><code>missing_external_crds</code></td><td>The chart needs a CRD that Stageproof could not install.</td><td>Pass the CRD with <code>--crd-file</code>.</td></tr>
    <tr><td><code>baseline_requires_external_dependency</code></td><td>The current chart cannot start in an empty cluster, because it needs something from outside it.</td><td>Check with values that work in an empty cluster, for example a public image and no external database.</td></tr>
    <tr><td><code>head_requires_external_dependency</code></td><td>The same, when you check a new chart on its own.</td><td>The same.</td></tr>
  </tbody>
</table></div>

  <template data-topic="limits" data-group="Reference" data-title="Scope and limits">
<p class="docs-lede">What Stageproof 0.1.7 covers, what it leaves out, and where a passing result says less than you might expect.</p>

<h2>What is not supported</h2>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Not supported</th><th>What that means for you</th></tr></thead>
  <tbody>
    <tr><td>Terraform providers and modules</td><td>A change to a provider version or a module version is not checked.</td></tr>
    <tr><td>Container image contents</td><td>Stageproof does not inspect an image. A new image is started only in the <a href="#live">live rehearsal</a>.</td></tr>
    <tr><td>Kustomize, Helmfile, Flux <code>HelmRelease</code>, plain manifests</td><td>These files are ignored.</td></tr>
    <tr><td>Argo CD Applications with several sources, <code>valuesObject</code>, <code>valueFiles</code>, or a Git path as the source</td><td>Only a single chart source with inline <code>helm.values</code> is read. See <a href="#argocd">Check an Argo CD Application</a>.</td></tr>
    <tr><td>Application dependencies, for example npm or Maven packages</td><td>Not checked.</td></tr>
  </tbody>
</table></div>

<h2>What a passing result does not cover</h2>
<ul>
  <li><strong><code>PASSED</code> is about files.</strong> Nothing was started. The chart renders, your values are still used, and no rule found a problem. Whether the new version runs is not known.</li>
  <li><strong><code>PROVEN</code> is about an empty cluster.</strong> The temporary cluster has no production data, no traffic, and none of the other workloads in your real cluster. The rehearsal shows that the upgrade and the rollback work mechanically.</li>
  <li><strong>The temporary cluster may run another Kubernetes version than yours.</strong> That happens when kind has no image for your version. The report then says which version the rehearsal ran on.</li>
  <li><strong>The API check uses a fixed list.</strong> It covers the removals listed in <a href="#cluster-version">Check against your Kubernetes version</a>. APIs added by CRDs are not judged.</li>
  <li><strong>The values check follows references.</strong> It knows whether a chart reads a key. It does not know whether the chart does something sensible with the value.</li>
  <li><strong>A pull request check covers the values files it knows about.</strong> Without a <code>charts</code> list in the configuration file, a chart in your repository is checked with its own <code>values.yaml</code> only. See <a href="#values-files">Check each values file of a chart</a>.</li>
</ul>

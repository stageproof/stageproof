  <template data-topic="overview" data-group="Start here" data-title="What Stageproof does">
<p class="docs-lede">Stageproof checks a Kubernetes upgrade before you merge it: Helm charts, Argo CD Applications, Flux HelmReleases, and rendered YAML manifests. It compares what you run today with what you want to deploy, and reports whether the upgrade is safe to apply to your cluster.</p>

<h2>The problem</h2>
<p>A chart upgrade can pass <code>helm lint</code> and <code>helm template</code> and still break a cluster. Those tools read the new chart on its own. They do not know which version you run today, which values you set, or which Kubernetes version your cluster runs. Three failures come from that gap:</p>
<ul>
  <li><strong>A setting you rely on stops working.</strong> The new chart renames or removes a values key. Helm ignores the old key without an error, so your override is no longer applied.</li>
  <li><strong>The chart uses an API your cluster no longer serves.</strong> Kubernetes removes old API versions over time. A chart that still uses one fails when it is applied.</li>
  <li><strong>The upgrade cannot be applied in place.</strong> Some fields cannot change on a running workload, for example the label selector of a Deployment. A fresh install works. The upgrade of an existing release fails.</li>
  <li><strong>The new chart deletes something you still need.</strong> Helm removes an object it no longer renders. A PersistentVolumeClaim, a Namespace, or a templated custom resource definition takes data or other objects with it.</li>
</ul>
<p>Stageproof finds these while the change is still a pull request.</p>

<h2>What it checks</h2>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Check</th><th>Question it answers</th><th>When it runs</th></tr></thead>
  <tbody>
    <tr><td>Chart rendering</td><td>Does the new chart render with your values?</td><td>Chart, Argo CD, and Flux runs (skipped for <code>--before</code> / <code>--after</code>)</td></tr>
    <tr><td>Values proof</td><td>Does every key in your values file still have an effect in the new chart?</td><td>When you pass a values file. Uncertain keys are render-proven. <code>--values-proof full</code> render-tests every key.</td></tr>
    <tr><td>Image tags</td><td>Does a new or changed container image tag exist for your node architecture?</td><td>When an image tag is new or changed (skip with <code>--offline</code>)</td></tr>
    <tr><td>Helm 4</td><td>Does a second helm binary render the same objects, and is <code>apiVersion: v3</code> set?</td><td>With <code>--helm-compare</code></td></tr>
    <tr><td>Local API server and API versions</td><td>Does a local Kubernetes API server of <code>--current-k8s</code> accept the upgrade, and are any APIs removed or deprecated?</td><td>Every run. The local API server is the default. <code>--api-server off</code> uses the built-in table.</td></tr>
    <tr><td>Impact and CRDs</td><td>What does the upgrade delete, restart, expose, privilege-escalate, or break in a CRD schema?</td><td>When comparing the old and new objects</td></tr>
    <tr><td>Cluster facts</td><td>What Kubernetes version, CRDs, stored versions, admission policies, and node architectures does your real cluster run?</td><td>With <code>stageproof facts export</code> and <code>--cluster-facts</code>. The calls are read-only.</td></tr>
    <tr><td>CRD size</td><td>Is a CRD too large to apply without server-side apply?</td><td>Every run</td></tr>
    <tr><td>Live rehearsal</td><td>Does the upgrade install, upgrade, run base-ref <code>smoke</code> commands, and roll back in a real cluster?</td><td>Only with <code>--live</code></td></tr>
  </tbody>
</table></div>

<h2>What you get back</h2>
<p>Every run ends with one of four results. The exit code of the command carries the same information, so a CI job can act on it.</p>
<p>The job log and the Markdown comment list Deletes, CRDs, Privilege, Exposure, Values, Restarts, and Not checked before the check list. A section with nothing in it is left out. Those lines are the finding messages. The report does not call a model.</p>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Result</th><th>Exit code</th><th>Meaning</th></tr></thead>
  <tbody>
    <tr><td><span class="verdict-badge ok">PROVEN</span></td><td><code>0</code></td><td>The checks passed and the upgrade was rehearsed in a temporary cluster.</td></tr>
    <tr><td><span class="verdict-badge ok">PASSED</span></td><td><code>0</code></td><td>The checks on the chart files passed. The upgrade was not rehearsed. The job log prints <code>NOT TESTED LIVE</code> in red, and the comment repeats it. The pipeline stays green.</td></tr>
    <tr><td><span class="verdict-badge bad">BLOCKED</span></td><td><code>1</code></td><td>The upgrade has a problem. The report names it.</td></tr>
    <tr><td><span class="verdict-badge warn">NOT CHECKED</span></td><td><code>2</code></td><td>Stageproof could not finish the check, or <code>--require-rehearsal</code> was set and no rehearsal ran.</td></tr>
  </tbody>
</table></div>
<p>See <a href="#results">Read the result</a> for the full report format.</p>

<h2>Two kinds of upgrade</h2>
<p>The word upgrade means two different things in these docs. They use different flags, so keep them apart.</p>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Kind</th><th>Example</th><th>What Stageproof does</th></tr></thead>
  <tbody>
    <tr><td><strong>Chart upgrade</strong></td><td>The argo-cd chart moves from 10.9.6 to 10.18.0.</td><td>This is the main job. Stageproof compares the two chart versions.</td></tr>
    <tr><td><strong>Kubernetes cluster upgrade</strong></td><td>Your cluster moves from Kubernetes 1.31 to 1.32.</td><td>Stageproof does not upgrade a cluster. It tells you whether a chart works on the version you run, and warns you about the version you plan to move to.</td></tr>
  </tbody>
</table></div>

<h2>What is supported</h2>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Input</th><th>Status</th></tr></thead>
  <tbody>
    <tr><td>A Helm chart in a directory</td><td>Supported</td></tr>
    <tr><td>Two versions of one chart in a Helm repository or an OCI registry (<code>--repo</code>, <code>--chart</code>, <code>--from</code>, <code>--to</code>)</td><td>Supported. See <a href="#cli">Commands and flags</a>.</td></tr>
    <tr><td>An Argo CD <code>Application</code> (HTTPS chart repository, <code>oci://</code> registry, local Git chart path, multi-source, and <code>.yaml.tmpl</code>)</td><td>Supported, including several sources and a chart path in this checkout</td></tr>
    <tr><td>A Flux <code>HelmRelease</code> (<code>helm.toolkit.fluxcd.io/v2</code>, <code>v2beta2</code>, or <code>v2beta1</code>)</td><td>Supported. See <a href="#flux">Check a Flux HelmRelease</a>.</td></tr>
    <tr><td>Two directories or files of rendered YAML (<code>--before</code> and <code>--after</code>)</td><td>Supported. See <a href="#manifests">Compare rendered manifests</a>.</td></tr>
    <tr><td>Terraform providers and modules</td><td>Not supported</td></tr>
    <tr><td>Container image contents</td><td>Not supported (registry tag existence and platform checks are supported on <code>main</code>)</td></tr>
    <tr><td>Kustomize and Helmfile</td><td>Not supported. <code>check-pr</code> also ignores a loose manifest that is not inside a chart.</td></tr>
  </tbody>
</table></div>
<p>The full list is in <a href="#limits">Scope and limits</a>. Measured accuracy numbers on 12 active incidents and 316 CNCF upgrade pairs across 105 CNCF projects are in <a href="https://github.com/stageproof/stageproof/blob/main/docs/accuracy.md">docs/accuracy.md</a>.</p>

<h2>What it never does</h2>
<ul>
  <li><strong>It does not change your repository.</strong> It does not commit, push, or edit files. It reads and reports.</li>
  <li><strong>It does not touch your real cluster.</strong> The live rehearsal runs in a temporary local cluster that Stageproof creates and deletes.</li>
  <li><strong>It does not use AI.</strong> Results come from fixed rules. The same input gives the same result.</li>
</ul>
  </template>

  <template data-topic="install" data-group="Start here" data-title="Install">
<p class="docs-lede">Stageproof is a single command line program. You can install the released <code>v0.3.1</code> binary from Homebrew, GitHub Releases, or the container image, or build the source on <code>main</code>.</p>

<h2>Requirements</h2>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Tool</th><th>Version</th><th>Needed for</th></tr></thead>
  <tbody>
    <tr><td>Go</td><td>1.27.4</td><td>Building from source on <code>main</code></td></tr>
    <tr><td>Helm</td><td>3 or 4 (tested on 3.22.1 and 4.3.2)</td><td>Chart, Argo CD, and Flux checks, and <code>stageproof check --repo</code>. Stageproof calls <code>helm template</code> and <code>helm pull</code>. Comparing rendered manifests does not call Helm.</td></tr>
    <tr><td>Git</td><td>Any recent version</td><td>Comparing against a branch and checking pull requests</td></tr>
    <tr><td>kind, kubectl, Docker</td><td>Any recent version</td><td>The live rehearsal only</td></tr>
  </tbody>
</table></div>

<h2>Install the released binary (v0.3.1)</h2>
<pre data-kind="cmd" data-label="Homebrew">
brew install stageproof/stageproof/stageproof</pre>
<pre data-kind="cmd" data-label="Container image">
docker run --rm ghcr.io/stageproof/stageproof:v0.3.1 version</pre>
<p>Signed archives and SBOMs are published on <a href="https://github.com/stageproof/stageproof/releases">GitHub Releases</a>.</p>

<h2>Build from source (main)</h2>
<p>In the Stageproof source tree, build from the repository root.</p>
<pre data-kind="cmd" data-label="Build the program">
go build -o stageproof ./cmd/stageproof</pre>

<h2>Put it on your PATH</h2>
<pre data-kind="cmd" data-label="Install for all users">
sudo mv stageproof /usr/local/bin/</pre>

<h2>Check that it works</h2>
<pre data-kind="cmd" data-label="Print the version">
stageproof version</pre>
<pre data-kind="out">
stageproof v0.3.1 (Apache-2.0)</pre>
<p>Next: <a href="#first-check">Run your first check</a>.</p>
  </template>

  <template data-topic="first-check" data-group="Start here" data-title="Run your first check">
<p class="docs-lede">This walkthrough compares two public versions of the metrics-server chart. You need Stageproof and Helm. It takes about a minute.</p>

<h2>1. Download two versions of a chart</h2>
<p>The first command downloads the version you pretend to run today. The second downloads the version you want to move to.</p>
<pre data-kind="cmd" data-label="Download version 3.12.2 and version 3.13.0">
helm pull metrics-server --repo https://kubernetes-sigs.github.io/metrics-server/ --version 3.12.2 --untar --untardir current
helm pull metrics-server --repo https://kubernetes-sigs.github.io/metrics-server/ --version 3.13.0 --untar --untardir new</pre>

<h2>2. Compare them</h2>
<pre data-kind="cmd" data-label="Check the upgrade">
stageproof check --current-chart current/metrics-server --new-chart new/metrics-server</pre>

<h2>3. Read the output</h2>
<pre data-kind="out">
stageproof  PASSED  exit 0
compare  current/metrics-server -> new/metrics-server
k8s  1.33  ·  checked: files

  ✓ PASS  helm template            rendered 9 Kubernetes objects cleanly
  ✓ PASS  values.yaml AST          no custom -f overlay passed (default chart values verified)
  ✓ PASS  k8s 1.33 compatibility   0 removed APIs or selector breaks on K8s 1.33

verdict  PASSED (exit 0)  · 87ms · 0 AI calls</pre>
<p>The result is <code>PASSED</code>. Stageproof rendered the new chart, found no removed Kubernetes API, and found no field that would block an in-place upgrade. The line <code>checked: files</code> says that no cluster was used. <a href="#results">Read the result</a> explains each line. <a href="#live">Rehearse the upgrade</a> is how a run becomes <code>PROVEN</code>.</p>

<h2>Where to go next</h2>
<ul>
  <li>You have your own chart and a values file: <a href="#compare-charts">Compare two chart versions</a>.</li>
  <li>Your chart lives in a git repository: <a href="#compare-git">Compare a chart with a git branch</a>.</li>
  <li>You deploy with Argo CD: <a href="#argocd">Check an Argo CD Application</a>.</li>
  <li>You deploy with Flux: <a href="#flux">Check a Flux HelmRelease</a>.</li>
  <li>You already rendered the manifests: <a href="#manifests">Compare rendered manifests</a>.</li>
  <li>You want this on every pull request: <a href="#pull-request">Check a pull request</a>.</li>
</ul>
  </template>

  <template data-topic="results" data-group="Start here" data-title="Read the result">
<p class="docs-lede">Every run prints a short report and ends with an exit code. This page explains each part of the report and what to do with each result.</p>

<h2>The report</h2>
<pre data-kind="out">
stageproof  PASSED  exit 0
compare  ./webapp-1.4.0 -> ./webapp-1.5.0
values  values-prod.yaml
k8s  1.33  ·  checked: files

  ✓ PASS  helm template            rendered 1 Kubernetes object cleanly
  ✓ PASS  values.yaml AST          2 keys: 0 proven by rendering, 2 read in templates
  ✓ PASS  k8s 1.33 compatibility   0 removed APIs or selector breaks on K8s 1.33

verdict  PASSED (exit 0)  · 1910ms · 0 AI calls</pre>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Line</th><th>What it tells you</th></tr></thead>
  <tbody>
    <tr><td><code>stageproof</code></td><td>The result and the exit code.</td></tr>
    <tr><td><code>compare</code></td><td>The current chart on the left and the new chart on the right.</td></tr>
    <tr><td><code>values</code></td><td>The values the chart was checked with. The line is left out when you gave no values file.</td></tr>
    <tr><td><code>k8s</code></td><td>The Kubernetes version the check used, then what was actually checked. <code>checked: files</code> means the built-in table was used and no API server was started. <code>checked: files, API server 1.35.0</code> names the patch of the local API server that answered. <code>checked: rendered manifests</code> is the same table for YAML you already rendered. <code>checked: rendered manifests, API server 1.35.0</code> means that API server answered. <code>checked: files, live cluster</code> means the upgrade was also rehearsed in a temporary cluster.</td></tr>
    <tr><td><code>PASS</code> / <code>FAIL</code> lines</td><td>One line per check.</td></tr>
    <tr><td><code>ERROR</code> blocks</td><td>A problem that blocks the upgrade. Each one has a rule name, the place it was found, and an explanation. They do not appear in the example above.</td></tr>
    <tr><td><code>WARN</code> blocks</td><td>Something to know about. A warning does not change the result.</td></tr>
    <tr><td><code>checked:</code></td><td><code>files</code>, <code>files, API server 1.35.0</code>, <code>rendered manifests</code>, <code>rendered manifests, API server 1.35.0</code>, or <code>files, live cluster</code>. This is the scope of the result. The patch is the API server that ran, not a claim about your cluster.</td></tr>
    <tr><td><code>WARN</code> with a reason code</td><td>The live rehearsal did not finish, and the report says why. A file check that you did not ask to rehearse does not print this.</td></tr>
    <tr><td><code>verdict</code></td><td>The result again, and how long the run took. <code>0 AI calls</code> states that no AI model took part in the result.</td></tr>
  </tbody>
</table></div>

<h2>The four results</h2>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Result</th><th>Exit code</th><th>What happened</th><th>What to do</th></tr></thead>
  <tbody>
    <tr><td><span class="verdict-badge ok">PROVEN</span></td><td><code>0</code></td><td>Every check passed, and the upgrade and the rollback both worked in a temporary cluster.</td><td>Merge.</td></tr>
    <tr><td><span class="verdict-badge ok">PASSED</span></td><td><code>0</code></td><td>Every check on the chart files passed. No cluster was used. The report says <code>NOT TESTED LIVE</code>.</td><td>The job stays green. Use <a href="#live"><code>--live</code></a> when you want the upgrade exercised. <code>--require-rehearsal</code> turns this case into <code>NOT CHECKED</code>.</td></tr>
    <tr><td><span class="verdict-badge bad">BLOCKED</span></td><td><code>1</code></td><td>At least one <code>ERROR</code> was found.</td><td>Fix what the report names, then run again. <a href="#findings">Findings</a> lists every rule.</td></tr>
    <tr><td><span class="verdict-badge warn">NOT CHECKED</span></td><td><code>2</code></td><td>Stageproof could not complete the check. Typical causes are a wrong flag, a git ref that does not exist, a chart that could not be downloaded, or <code>--require-rehearsal</code> without a completed rehearsal.</td><td>Read the error message, fix the cause, and run again. It says nothing about whether the upgrade is safe.</td></tr>
  </tbody>
</table></div>

<h2>Use the exit code in a script</h2>
<p>Exit code <code>0</code> means <code>PASSED</code> or <code>PROVEN</code>. Any other exit code is a failure. A script that stops on the first non-zero status already does the right thing.</p>
<pre data-kind="cmd" data-label="Fail unless the result is PASSED or PROVEN">
stageproof check --current-chart ./webapp-1.4.0 --new-chart ./webapp-1.5.0</pre>

<h2>Other output formats</h2>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Flag</th><th>What you get</th></tr></thead>
  <tbody>
    <tr><td><code>--format markdown</code></td><td>The report as Markdown on standard output.</td></tr>
    <tr><td><code>--format json</code></td><td>The report as JSON on standard output. The first field is <code>schema_version</code>, and it is <code>1</code>. The shape is <code>docs/report.schema.json</code>.</td></tr>
    <tr><td><code>--format sarif</code></td><td>One SARIF 2.1.0 log on standard output. A blocker is <code>error</code>, a warning is <code>warning</code>, and info is <code>note</code>. The message is the finding message. <code>--out</code> stays JSON.</td></tr>
    <tr><td><code>--out report.json</code></td><td>The JSON report in a file, in addition to the normal output.</td></tr>
    <tr><td><code>--comment-file comment.md</code></td><td>The Markdown report in a file, in addition to the normal output. Use it for a pull request comment.</td></tr>
  </tbody>
</table></div>
<p><code>--format sarif</code> prints one log. <code>check-pr</code> puts every chart in that same log. This run exits 1. The command is the dropped-key fixture with <code>--api-server off</code>:</p>
<pre data-kind="cmd">
stageproof check \
  --current-chart testdata/dropped/base \
  --new-chart testdata/dropped/head \
  -f testdata/dropped/values.yaml \
  --current-k8s 1.33 \
  --api-server off \
  --format sarif</pre>
<pre data-kind="out">
{
  "$schema": "https://docs.oasis-open.org/sarif/sarif/v2.1.0/errata01/os/schemas/sarif-schema-2.1.0.json",
  "version": "2.1.0",

  <template data-topic="compare-git" data-group="Guides" data-title="Compare a chart with a git branch">
<p class="docs-lede">Check a chart that lives in your repository against the version of that chart on another branch. You do not need a second copy of the chart on disk.</p>

<dl class="doc-facts">
  <div><dt>Use it when</dt><dd>You changed a chart on a branch and want to compare it with <code>main</code>.</dd></div>
  <div><dt>Finds</dt><dd>The same problems as <a href="#compare-charts">Compare two chart versions</a>.</dd></div>
  <div><dt>Needs</dt><dd>Helm and Git. Run the command inside the repository.</dd></div>
</dl>

<h2>Run the check</h2>
<p>The chart is in <code>charts/webapp</code>. You are on a branch that changed it.</p>
<pre data-kind="cmd">
stageproof check --new-chart charts/webapp --current-git main</pre>
<pre data-kind="out">
stageproof  PASSED  exit 0
compare  main:charts/webapp -> charts/webapp
k8s  1.33  ·  checked: files

  ✓ PASS  helm template            rendered 1 Kubernetes object cleanly
  ✓ PASS  values.yaml AST          no custom -f overlay passed (default chart values verified)
  ✓ PASS  k8s 1.33 compatibility   0 removed APIs or selector breaks on K8s 1.33

verdict  PASSED (exit 0)  · 90ms · 0 AI calls</pre>

<h2>What happens</h2>
<ol>
  <li>Stageproof copies <code>charts/webapp</code> as it exists on <code>main</code> into a temporary directory. That copy is the current chart.</li>
  <li>The files in your working directory are the new chart.</li>
  <li>The two are compared, and the temporary copy is deleted.</li>
</ol>
<p>The <code>compare</code> line shows this as <code>main:charts/webapp -&gt; charts/webapp</code>. Your branch and your working directory are not changed.</p>

<h2>What you can pass to <code>--current-git</code></h2>
<p>Any name that Git can resolve: a branch, a tag, or a commit hash. The chart directory must exist at that point in history. If it does not, the command prints an error and ends with exit code <code>3</code>.</p>
<p>In CI, a shallow clone may not contain the branch you compare with. Fetch it first. <a href="#ci-gitlab">GitLab CI</a> shows how.</p>
  </template>

  <template data-topic="manifests" data-group="Guides" data-title="Compare rendered manifests">
<p class="docs-lede">Compare two sets of YAML you already rendered. Stageproof does not call Helm. The released binary is v0.3.1.</p>

<h2>The example</h2>
<p>The directory <code>before</code> has a Deployment and a PersistentVolumeClaim. The directory <code>after</code> has the same Deployment and drops the claim. The sample below is the output of this command on that input.</p>
<pre data-kind="cmd">
stageproof check \
  --before testdata/manifests/before \
  --after testdata/manifests/after \
  --current-k8s 1.35 \
  --api-server auto</pre>
<pre data-kind="out">
!  The new manifests drop PersistentVolumeClaim/demo/data. The data on that claim goes with it.
stageproof  BLOCKED  exit 1
compare  testdata/manifests/before -> testdata/manifests/after
k8s  1.35  ·  checked: rendered manifests, API server 1.35.0

Deletes
  ERROR  The new manifests drop PersistentVolumeClaim/demo/data. The data on that claim goes with it.

  ○ SKIP  required values gate     Skipped. These inputs are rendered manifests, not Helm charts.
  ○ SKIP  helm template            Skipped. The manifests were already rendered.
  ○ SKIP  values.yaml AST          Skipped. There is no chart template to read.
  ○ SKIP  upgrade signals          Skipped. There is no chart to compare.
  ✓ PASS  image tags               no new or changed image
  ✓ PASS  API server 1.35.0        Kubernetes 1.35.0 accepted the upgrade
  ✕ FAIL  impact                   Compared stored objects from the API server.
  ✓ PASS  k8s 1.35 compatibility   current Kubernetes was checked by API server 1.35.0

  ERROR  impact.delete.pvc
         PersistentVolumeClaim/demo/data
         The new manifests drop PersistentVolumeClaim/demo/data. The data on that claim goes with it.

verdict  BLOCKED (exit 1)  · 3426ms · 0 AI calls
</pre>

<h2>What ran</h2>
<ul>
  <li>Every <code>.yaml</code> and <code>.yml</code> file under each directory is read, in name order, including files in subdirectories. A single file works the same way.</li>
  <li>The chart stages are skipped. There is no chart to template and no values file to read.</li>
  <li>The local API server applied the current objects and dry-ran the new ones. It accepted the Deployment that remains. <code>checked:</code> names the patch that answered. <code>--api-server off</code> uses the built-in table and <code>checked:</code> reads <code>rendered manifests</code>.</li>
  <li>The impact check blocks because the claim is gone. The data on that claim goes with it.</li>
  <li>The API table found no removed API.</li>
</ul>
<p><code>--live</code> with <code>--before</code> and <code>--after</code> exits 2. Manifest mode does not install a chart. Values files and <code>--set</code> are rejected for the same reason. A file that is not <code>.yaml</code> or <code>.yml</code>, or a directory with none of those files, is <code>manifest.invalid_yaml</code> and exits 1.</p>
<p><code>check-pr</code> does not pick up a loose manifest. It still checks a file inside a chart, including a file the pull request deleted. See <a href="#pull-request">Check a pull request</a>.</p>
  </template>

  <template data-topic="argocd" data-group="Guides" data-title="Check an Argo CD Application">
<p class="docs-lede">Check the Helm chart an Argo CD Application renders. A remote chart is downloaded. A chart path in this checkout is read from Git. The released binary is v0.3.1. It reads several sources and a chart path in this checkout.</p>

<dl class="doc-facts">
  <div><dt>Use it when</dt><dd>An Application pins a Helm chart, in a chart repository or in this Git repository, and the pull request changes the chart or its values.</dd></div>
  <div><dt>Finds</dt><dd>The same problems as <a href="#compare-charts">Compare two chart versions</a>, using the values the Application actually applies.</dd></div>
  <div><dt>Needs</dt><dd>Helm and Git. A remote chart also needs network access to that chart repository.</dd></div>
</dl>

<h2>The example</h2>
<p>The chart lives in this repository. A second source only supplies a values file. On <code>main</code> the tag is <code>1.27</code>. The working tree changes it to <code>1.28</code>.</p>
<pre data-kind="file" data-label="apps/web.yaml">
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web
spec:
  sources:
    - repoURL: https://example.test/stageproof.git
      path: charts/web
      helm:
        valueFiles:
          - $values/values/prod.yaml
    - repoURL: https://example.test/stageproof
      ref: values</pre>

<h2>Run the check</h2>
<pre data-kind="cmd">
stageproof check --argocd-file apps/web.yaml --current-git main --api-server off</pre>
<pre data-kind="out">
!  NOT TESTED LIVE. This job did not rehearse the upgrade. The files were checked. The upgrade itself was not.
stageproof  PASSED  exit 0
compare  charts/web (main) -> charts/web (apps/web.yaml)
values  $values/values/prod.yaml
k8s  1.33  ·  checked: files

Restarts
  INFO  The pod template of Deployment/default/web changed at spec.template.spec.containers[name=app].image. The pods will restart. A restart is normal for an upgrade.

  ✓ PASS  helm template            rendered 1 Kubernetes object cleanly
  ✓ PASS  values.yaml AST          2 keys: 0 proven by rendering, 2 read in templates
  ! WARN  upgrade signals          1 named change
  ✓ PASS  image tags               1 new or changed image tag checked
  ✓ PASS  impact                   Compared rendered objects. The API server did not run, so a default the server adds is not in this comparison.
  ✓ PASS  k8s 1.33 compatibility   0 removed APIs or selector breaks on K8s 1.33

  INFO  impact.restart
         Deployment/default/web
         The pod template of Deployment/default/web changed at spec.template.spec.containers[name=app].image. The pods will restart. A restart is normal for an upgrade.
  WARN  helm.image.changed
         1 container image changed. Deployment/default/web.template.spec.containers[0] app container moves from nginx:1.27 to nginx:1.28.
         The render names a different image, including images on custom resources and images passed as container arguments. Whether that tag exists is a separate check.

verdict  PASSED (exit 0)  · 1490ms · 0 AI calls
</pre>

<h2>What happens</h2>
<ol>
  <li>Stageproof reads <code>apps/web.yaml</code> in the working tree, and the same file on <code>main</code>.</li>
  <li><code>repoURL</code> matches a remote of this checkout, so the chart path is read here. It is not cloned and it is not pulled.</li>
  <li>The values file <code>$values/values/prod.yaml</code> is read from the root of the <code>values</code> source. On <code>main</code> the tag is <code>1.27</code>. In the working tree it is <code>1.28</code>.</li>
  <li>It runs the same checks as for two chart directories.</li>
</ol>
<p>The <code>values</code> line is the file the Application named. The image warning is the tag from that file at each revision. <code>--api-server off</code> is why the impact line says the API server did not run. The default is <code>auto</code>.</p>
<p>A remote chart still works. <code>spec.source.repoURL</code> plus <code>spec.source.chart</code> is downloaded with <code>helm pull</code> at <code>targetRevision</code>, and the temporary directory is removed after the check. <code>oci://</code> is a registry pull. Inline <code>helm.values</code> is still a values file.</p>

<h2>What Stageproof reads from the Application</h2>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Field</th><th>Used as</th></tr></thead>
  <tbody>
    <tr><td><code>spec.sources</code></td><td>When this list is set, it is the source list. <code>spec.source</code> is not also read.</td></tr>
    <tr><td><code>repoURL</code> and <code>chart</code></td><td>A Helm repository, or an <code>oci://</code> registry. <code>targetRevision</code> is the chart version.</td></tr>
    <tr><td><code>repoURL</code> and <code>path</code></td><td>A chart directory in this checkout, when <code>repoURL</code> matches a Git remote. The revision is the one being compared, not <code>targetRevision</code>.</td></tr>
    <tr><td><code>helm.valueFiles</code></td><td>Values files. A path without <code>$</code> is relative to the chart. <code>$name/file.yaml</code> is a file at the root of the source whose <code>ref</code> is <code>name</code>.</td></tr>
    <tr><td><code>helm.values</code> and <code>helm.valuesObject</code></td><td>Inline values. When <code>valuesObject</code> is set, <code>values</code> is ignored. They are not merged.</td></tr>
    <tr><td><code>helm.parameters</code></td><td>Overrides, the same as <code>--set</code>. <code>forceString: true</code> is <code>--set-string</code>. The last duplicate name wins.</td></tr>
    <tr><td><code>helm.fileParameters</code></td><td>A file passed like <code>--set-file</code>. A missing file is <code>NOT CHECKED</code>.</td></tr>
    <tr><td><code>helm.releaseName</code></td><td>The Helm release name. When it is empty, the Application name is used.</td></tr>
    <tr><td><code>helm.skipCrds</code></td><td><code>true</code> skips CRDs in <code>crds/</code>, like <code>helm upgrade --skip-crds</code>. <code>false</code> applies them. When the field is absent, the check says it does not know.</td></tr>
    <tr><td><code>spec.syncPolicy.syncOptions</code></td><td>If it contains <code>ServerSideApply=true</code>, the <a href="#large-crds">large CRD warning</a> is not raised.</td></tr>
  </tbody>
</table></div>
<p>Order of precedence, highest last, is the chart <code>values.yaml</code>, then <code>valueFiles</code> (the last file wins), then <code>values</code>, then <code>valuesObject</code>, then <code>parameters</code>. A glob in <code>valueFiles</code> expands in lexical order inside that one entry.</p>
<p>A missing values file is <code>NOT CHECKED</code> when <code>ignoreMissingValueFiles</code> is false, which is the default. The chart is not rendered from its defaults. <code>true</code> skips that missing file and continues.</p>
<p>These inputs are <code>NOT CHECKED</code>. Nothing is cloned and no chart defaults are rendered in their place:</p>
<ul>
  <li>An <code>ApplicationSet</code>. Generators are not expanded.</li>
  <li>A chart path, or a <code>$ref</code> values file, whose <code>repoURL</code> is not a remote of this checkout.</li>
  <li>A <code>ref</code> source that also sets <code>path</code>. Argo CD would generate manifests from that directory as well as read values.</li>
  <li>More than one chart source, <code>sourceHydrator</code>, a values file downloaded from a URL, or a <code>valueFiles</code> entry that uses a recursive <code>**</code> glob.</li>
</ul>

<h2>Applications written as templates</h2>
<p>Some teams generate Application files from a template, for example a Terraform <code>.yaml.tmpl</code> file with <code>${...}</code> placeholders. Stageproof accepts these files. Before reading the file it replaces each placeholder with a fixed sample value, so that the file is valid YAML: <code>10Gi</code> when the placeholder name contains <code>size</code>, <code>2</code> when it contains <code>replica</code>, <code>count</code>, <code>port</code>, or <code>concurrent</code>, and a fixed text for everything else.</p>
  </template>

  <template data-topic="flux" data-group="Guides" data-title="Check a Flux HelmRelease">
<p class="docs-lede">Check the Helm chart a Flux HelmRelease renders. A Helm repository or an OCI chart is downloaded. A GitRepository in this checkout is read from Git. The released binary is v0.3.1.</p>

<dl class="doc-facts">
  <div><dt>Use it when</dt><dd>A HelmRelease pins a chart, in a Helm repository, an OCI registry, or this Git repository, and the pull request changes the chart, the source, or its values.</dd></div>
  <div><dt>Finds</dt><dd>The same problems as <a href="#compare-charts">Compare two chart versions</a>, using the values the HelmRelease actually applies.</dd></div>
  <div><dt>Needs</dt><dd>Helm and Git. A remote chart also needs network access to that chart repository or registry.</dd></div>
</dl>

<h2>The example</h2>
<p>The chart is <code>charts/web</code> in this repository. <code>sources/git.yaml</code> is a GitRepository named <code>charts</code> whose URL is a remote of this checkout. <code>values/prod.yaml</code> is a ConfigMap named <code>prod-values</code>. On <code>main</code> its <code>values.yaml</code> key sets <code>tag</code> to <code>1.27</code>. The working tree sets <code>1.28</code>.</p>
<pre data-kind="file" data-label="apps/web.yaml">
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: web
spec:
  chart:
    spec:
      chart: charts/web
      sourceRef:
        kind: GitRepository
        name: charts
  valuesFrom:
    - kind: ConfigMap
      name: prod-values</pre>

<h2>Run the check</h2>
<pre data-kind="cmd">
stageproof check --flux-file apps/web.yaml --current-git main --api-server off</pre>
<pre data-kind="out">
!  NOT TESTED LIVE. This job did not rehearse the upgrade. The files were checked. The upgrade itself was not.
stageproof  PASSED  exit 0
compare  charts/web (main) -> charts/web (apps/web.yaml)
values  HelmRelease values (ConfigMap/prod-values)
k8s  1.33  ·  checked: files

Restarts
  INFO  The pod template of Deployment/default/web changed at spec.template.spec.containers[name=app].image. The pods will restart. A restart is normal for an upgrade.

  ✓ PASS  helm template            rendered 1 Kubernetes object cleanly
  ✓ PASS  values.yaml AST          2 keys: 0 proven by rendering, 2 read in templates
  ! WARN  upgrade signals          1 named change
  ✓ PASS  image tags               1 new or changed image tag checked
  ✓ PASS  impact                   Compared rendered objects. The API server did not run, so a default the server adds is not in this comparison.
  ✓ PASS  k8s 1.33 compatibility   0 removed APIs or selector breaks on K8s 1.33

  INFO  impact.restart
         Deployment/default/web
         The pod template of Deployment/default/web changed at spec.template.spec.containers[name=app].image. The pods will restart. A restart is normal for an upgrade.
  WARN  helm.image.changed
         1 container image changed. Deployment/default/web.template.spec.containers[0] app container moves from nginx:1.27 to nginx:1.28.
         The render names a different image, including images on custom resources and images passed as container arguments. Whether that tag exists is a separate check.

verdict  PASSED (exit 0)  · 1495ms · 0 AI calls
</pre>

<h2>What happens</h2>
<ol>
  <li>Stageproof reads <code>apps/web.yaml</code> in the working tree, and the same file on <code>main</code>.</li>
  <li>The GitRepository URL matches a remote of this checkout, so <code>charts/web</code> is read here. It is not cloned and it is not pulled. The revision is the one being compared. The branch named on the GitRepository is not fetched.</li>
  <li>The ConfigMap <code>prod-values</code> is read from a YAML file in this repository. <code>data["values.yaml"]</code> is the values file. On <code>main</code> the tag is <code>1.27</code>. In the working tree it is <code>1.28</code>.</li>
  <li>It runs the same checks as for two chart directories.</li>
</ol>
<p>The <code>values</code> line names the ConfigMap. It does not print the values. The image warning is the tag from that ConfigMap at each revision. <code>--api-server off</code> is why the impact line says the API server did not run. The default is <code>auto</code>.</p>

<h2>What Stageproof reads from the HelmRelease</h2>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Field</th><th>Used as</th></tr></thead>
  <tbody>
    <tr><td><code>spec.chart</code> or <code>spec.chartRef</code></td><td>Exactly one of these. Both, or neither, is <code>NOT CHECKED</code>.</td></tr>
    <tr><td><code>spec.chart.spec</code></td><td><code>chart</code> and <code>sourceRef</code> name a HelmRepository, an OCIRepository, or a GitRepository in this repository. <code>kind</code> defaults to <code>HelmChart</code>. <code>version</code> is the chart version for a Helm repository and is ignored for Git. An empty version is <code>*</code>.</td></tr>
    <tr><td><code>spec.chartRef</code></td><td>An OCIRepository or a HelmChart in this repository. <code>ExternalArtifact</code> is <code>NOT CHECKED</code>.</td></tr>
    <tr><td><code>spec.values</code></td><td>Inline values, applied after <code>valuesFrom</code> entries that have no <code>targetPath</code>.</td></tr>
    <tr><td><code>spec.valuesFrom</code></td><td>ConfigMap <code>data</code>, or Secret <code>stringData</code> and then <code>data</code>. <code>valuesKey</code> defaults to <code>values.yaml</code>. Entries merge in order. A later map overwrites an earlier one. <code>targetPath</code> is applied after <code>spec.values</code> and overwrites that path, including inline values. <code>literal: true</code> keeps the string.</td></tr>
    <tr><td><code>spec.releaseName</code> and <code>spec.targetNamespace</code></td><td>The Helm release name is <code>releaseName</code>, or <code>targetNamespace-name</code> when <code>targetNamespace</code> is set, or the HelmRelease name. A name longer than 53 characters is shortened. The namespace is <code>targetNamespace</code>, then <code>metadata.namespace</code>, then <code>default</code>.</td></tr>
    <tr><td><code>spec.upgrade.crds</code></td><td><code>Skip</code>, <code>Create</code>, or <code>CreateReplace</code>. When the field is omitted the check uses Skip: CRDs under <code>crds/</code> are neither installed nor upgraded. The helm-controller type comment says that. The user guide lists Create as the default for both install and upgrade. This check is an upgrade, so it follows the type comment.</td></tr>
  </tbody>
</table></div>
<p>A HelmRepository is downloaded with <code>helm pull</code>. An OCIRepository uses <code>spec.url</code> and one of <code>tag</code>, <code>semver</code>, or <code>digest</code>. <code>spec.insecure: true</code> is an HTTP registry. A chart <code>valuesFiles</code> list is merged in order, last wins, and the chart <code>values.yaml</code> is not included unless it is listed. A missing file in that list is <code>NOT CHECKED</code> when <code>ignoreMissingValuesFiles</code> is false, which is the default. The chart is not rendered from its defaults.</p>
<p>A <code>valuesFrom</code> object that is not a file in this repository is <code>flux.values.unreadable</code>. The chart is still rendered. The result stays <code>PASSED</code>, including after a rehearsal. The finding names the reference and does not print a value. <code>optional: true</code> skips a missing object. A missing <code>valuesKey</code> is still named. A Secret with <code>sops</code> or <code>ENC[</code> is not decrypted. The same finding names it.</p>
<p>These inputs are <code>NOT CHECKED</code>. Nothing is cloned and no chart defaults are rendered in their place:</p>
<ul>
  <li>A GitRepository whose URL is not a remote of this checkout.</li>
  <li><code>spec.chart</code> and <code>spec.chartRef</code> both set, or neither set.</li>
  <li><code>ExternalArtifact</code>, a Bucket source, or another chart kind.</li>
  <li>More than one of <code>tag</code>, <code>semver</code>, and <code>digest</code> on an OCIRepository.</li>
  <li>A chart <code>valuesFiles</code> entry that is missing when <code>ignoreMissingValuesFiles</code> is false.</li>
</ul>
<p><code>${...}</code> in the chart name, the version, the repository URL, or a source name is <code>NOT CHECKED</code> unless <code>templatePlaceholders</code> sets that token. The same token in values, a name, or <code>targetPath</code> becomes <code>stageproof-placeholder</code> and the report says <code>helm.config.placeholder_used</code>.</p>
  </template>

  <template data-topic="pull-request" data-group="Guides" data-title="Check a pull request">
<p class="docs-lede">Check everything a pull request changes with one command. You do not tell Stageproof which chart changed. It reads the git diff and works that out.</p>

<dl class="doc-facts">
  <div><dt>Use it when</dt><dd>You want one command for CI, or you want to check your branch before you open a pull request.</dd></div>
  <div><dt>Finds</dt><dd>Changed charts, changed Argo CD Applications, and changed Flux HelmReleases, then checks each one.</dd></div>
  <div><dt>Needs</dt><dd>Helm and Git. Run the command inside the repository, on the pull request branch.</dd></div>
</dl>

<h2>Run the check</h2>
<p>Pass the branch that the pull request will merge into.</p>
<pre data-kind="cmd">
stageproof check-pr --current-git main</pre>
<p>One Application prints the same report as <code>stageproof check --argocd-file</code>. The sample is in <a href="#argocd">Check an Argo CD Application</a>. A change to a values file the Application names is enough. The Application file itself does not have to change. A Flux HelmRelease works the same way. The sample is in <a href="#flux">Check a Flux HelmRelease</a>. A change to the source object, a <code>valuesFrom</code> file, or a file under a chart path in this checkout is enough.</p>

<h2>How it decides what to check</h2>
<p>Stageproof lists the files that differ between the target branch and your branch, then handles each file by its type.</p>
<div class="doc-table-wrap"><table class="doc-table">
  <thead><tr><th>Changed file</th><th>What Stageproof checks</th></tr></thead>
  <tbody>
    <tr><td>An Argo CD Application file (<code>.yaml</code>, <code>.yml</code>, or <code>.yaml.tmpl</code>)</td><td>That Application. A remote chart is pulled at each revision. A Git path in this checkout is read from each revision. An <code>ApplicationSet</code> is <code>NOT CHECKED</code>.</td></tr>
    <tr><td>A values file an Application in this repository names, including a <code>$ref/</code> path</td><td>That Application, with the file read on the target branch and on your branch.</td></tr>
    <tr><td>A Flux HelmRelease (<code>.yaml</code> or <code>.yml</code>)</td><td>That HelmRelease. A Helm repository or an OCI chart is pulled at each revision. A GitRepository in this checkout is read from each revision. Another Git repository is <code>NOT CHECKED</code>.</td></tr>
    <tr><td>A source object, a <code>valuesFrom</code> ConfigMap or Secret, or a file under a chart path a HelmRelease names</td><td>That HelmRelease, with each side read at its own revision.</td></tr>
    <tr><td>Any file inside a chart directory, including a file the pull request deleted</td><td>The whole chart on the target branch against the chart in your branch. Stageproof finds the chart by walking up to the nearest <code>Chart.yaml</code>. The file does not have to exist on the branch you are checking. A change inside a subchart under <code>charts/</code> is checked as a change to the parent chart.</td></tr>
    <tr><td>Any other file</td><td>Nothing. The file is ignored.</td></tr>
  </tbody>
</table></div>
<p>For a chart in your repository, Stageproof uses the chart's own <code>values.yaml</code> as the values file. To check the values files you deploy with, see <a href="#values-files">Check each values file of a chart</a>.</p>

<h2>When nothing relevant changed</h2>
<p>If the pull request changes no chart, no Application, and no HelmRelease, Stageproof prints one line and exits <code>0</code>. There was nothing to check, so the pipeline stays green:</p>
<pre data-kind="out">
stageproof check-pr: no Helm charts, Argo CD Applications, or Flux HelmReleases modified between main and HEAD.</pre>

<h2>When several charts changed</h2>
<p>Each chart is checked in turn and each prints its own report. The result of the pull request is the worst of those results: <code>BLOCKED</code>, then <code>NOT CHECKED</code>, then <code>PASSED</code>, then <code>PROVEN</code>. <code>PASSED</code> and <code>PROVEN</code> both exit <code>0</code>. <code>PASSED</code> is reported when any chart was not rehearsed.</p>
<p><code>--comment-file</code> writes one Markdown file for the whole pull request. With one check it is that report. With several it starts with a summary, followed by every report in full:</p>
<pre data-kind="file" data-label="The start of the comment file for a pull request that changed two charts">
## Stageproof: `BLOCKED` (exit `1`) across 3 checks

| Compared | Values | Result |
|---|---|---|
| `main:charts/billing` → `charts/billing` | `charts/billing/values.yaml` | **PASSED** |
| `main:charts/webapp` → `charts/webapp` | `charts/webapp/values-prod.yaml` | **BLOCKED** |
| `main:charts/webapp` → `charts/webapp` | `charts/webapp/values.yaml` | **PASSED** |</pre>
<p><code>--out</code> writes one JSON file with the overall <code>verdict</code>, the <code>exit_code</code>, and a <code>reports</code> list that holds every report.</p>

<h2>Who opened the pull request does not matter</h2>
<p>Stageproof reads Git. It does not call Renovate, Dependabot, GitHub, or GitLab to find out what changed. A pull request from a person and a pull request from a bot are checked the same way.</p>
  </template>

  <template data-topic="values-files" data-group="Guides" data-title="Check each values file of a chart">
<p class="docs-lede">Most charts are deployed more than once, with a different values file for each environment. Tell Stageproof which values files belong to a chart, and a pull request check covers every one of them.</p>

<dl class="doc-facts">
  <div><dt>Use it when</dt><dd>A chart in your repository has values files such as <code>values-prod.yaml</code> and <code>values-staging.yaml</code>.</dd></div>
  <div><dt>Finds</dt><dd>A values key that stops working in one environment, even when the chart defaults are fine.</dd></div>
  <div><dt>Needs</dt><dd>A <code>.stageproof.yaml</code> file in the top directory of the repository.</dd></div>
</dl>

<h2>Why the chart's own values file is not enough</h2>
<p>Without a configuration file, a pull request check renders the chart with its own <code>values.yaml</code>. Those are the chart defaults, and a chart always agrees with its own defaults. A key that only your production file sets is never looked at.</p>

<h2>1. List the values files of the chart</h2>
<pre data-kind="file" data-label=".stageproof.yaml">
charts:
  - name: webapp
    path: charts/webapp
    valuesFiles:
      - charts/webapp/values-prod.yaml
      - charts/webapp/values.yaml</pre>
<p>Paths are relative to the top directory of the repository. <code>stageproof init</code> writes this list for you: it finds every chart, and for each chart every <code>values.yaml</code>, <code>values-*.yaml</code>, and file in a <code>ci</code> directory.</p>

<h2>Rules</h2>
<ul>
  <li><strong>Each file is checked on its own.</strong> The files in the list are not merged. If one deployment needs two files layered on each other, use <code>stageproof check</code> with <code>-f</code> twice.</li>
  <li><strong>Only listed charts change behavior.</strong> A chart that is not in the list is checked with its own <code>values.yaml</code>.</li>
  <li><strong>A file that does not exist is skipped.</strong></li>
  <li><strong>The list applies to <code>stageproof check-pr</code>.</strong> <code>stageproof check</code> uses the files you pass with <code>-f</code>.</li>
</ul>

  <template data-topic="cluster-version" data-group="Guides" data-title="Check against your Kubernetes version">
<p class="docs-lede">Tell Stageproof which Kubernetes version your cluster runs. It then reports any resource in the chart that uses an API your cluster no longer serves.</p>

<dl class="doc-facts">
  <div><dt>Use it when</dt><dd>Always. Give the version with <code>--current-k8s</code>, with <code>--cluster-facts</code>, or once in the <a href="#config">configuration file</a>. The flag wins, then the facts file, then the configuration file. Without any of them, Stageproof assumes Kubernetes <code>1.33</code>.</dd></div>
  <div><dt>Finds</dt><dd>Resources that use a removed API, and resources that use a deprecated one.</dd></div>
  <div><dt>Needs</dt><dd>Helm, or manifests you already rendered. The check does not connect to a cluster. <code>stageproof facts export</code> does, when you give it a kubeconfig. See <a href="#cluster-facts">Read a cluster</a>.</dd></div>
</dl>

<h2>The example</h2>
<p>The <code>ratelimit</code> chart contains a <code>FlowSchema</code> written for the API version <code>flowcontrol.apiserver.k8s.io/v1beta3</code>. Kubernetes removed that version in 1.32. Your cluster runs 1.32.</p>

<h2>Run the check</h2>
<p>This sample uses <code>--api-server off</code>, so the removed API comes from the built-in table.</p>
<pre data-kind="cmd">
stageproof check --new-chart ./ratelimit --current-k8s 1.32 --api-server off</pre>
<pre data-kind="out">
stageproof  BLOCKED  exit 1
compare  (single-chart check) -> ./ratelimit
k8s  1.32  ·  checked: files

  ✓ PASS  helm template            rendered 1 Kubernetes object cleanly
  ✓ PASS  values.yaml AST          no custom -f overlay passed (default chart values verified)
  ✕ FAIL  k8s 1.32 compatibility   1 removed API or immutable upgrade blocker

  ERROR  k8s.api.removed
         FlowSchema/default/stageproof-rel-tenants
         API `flowcontrol.apiserver.k8s.io/v1beta3` (FlowSchema) was removed in Kubernetes 1.32 (target is 1.32).
         Migrate resource to `flowcontrol.apiserver.k8s.io/v1`.

verdict  BLOCKED (exit 1)  · 510ms · 0 AI calls</pre>

<h2>What the result means</h2>
<p>A cluster on Kubernetes 1.32 rejects this resource. The report names the resource, the API version it uses, and the version to move to.</p>
<p>On a cluster that runs 1.31, the same chart still works. Stageproof then reports <code>WARN k8s.api.deprecated</code> and the result is not blocked.</p>

<h2>The default asks an API server</h2>
<p><code>--api-server auto</code> is the default. It starts <code>kube-apiserver</code> and <code>etcd</code> for the newest published patch of <code>--current-k8s</code>, applies the current objects, and dry-runs the new ones. The result word does not change: without <code>--live</code> a clean upgrade is still <code>PASSED</code>, and the log still says <code>NOT TESTED LIVE</code>. The line <code>checked:</code> names the patch that ran.</p>
<p>This run is the Job fixture in the repository. The pod template image changes. Kubernetes rejects that update.</p>
<pre data-kind="cmd">
stageproof check \
  --current-chart corpus/incidents/job-pod-template-changed/before \
  --new-chart corpus/incidents/job-pod-template-changed/after \
  --current-k8s 1.35</pre>
<pre data-kind="out">
stageproof  BLOCKED  exit 1
compare  corpus/incidents/job-pod-template-changed/before -> corpus/incidents/job-pod-template-changed/after
k8s  1.35  ·  checked: files, API server 1.35.0

  ✓ PASS  helm template            rendered 1 Kubernetes object cleanly
  ✓ PASS  values.yaml AST          no custom -f overlay passed (default chart values verified)
  ! WARN  upgrade signals          1 named change
  ✕ FAIL  API server 1.35.0        1 rejection
  ✓ PASS  k8s 1.35 compatibility   current Kubernetes was checked by API server 1.35.0

  WARN  helm.image.changed
         1 container image changed. Job/default/migrate.template.spec.containers[0] job container moves from busybox:1.36 to busybox:1.37.
         The render names a different image, including images on custom resources and images passed as container arguments. Whether that tag exists is a separate check.
  ERROR  k8s.apply.immutable_field
         Job/default/migrate
         Kubernetes rejected the update. `spec.template` is immutable.

verdict  BLOCKED (exit 1)  · 2668ms · 0 AI calls</pre>
<p>Helm 3.22.1 drops a field the schema does not declare, warns, and the upgrade succeeds. A new Helm 4 install uses server-side apply and rejects that field. An upgrade of a release Helm 3 created stays client-side, so the same field stays a warning unless you pass <code>--server-side-apply</code>. <a href="https://helm.sh/docs/overview/#server-side-apply">Helm's upgrade notes</a> describe that latch.</p>

<h2>How the check works</h2>
<ol>
  <li>Stageproof renders the chart for the version you gave, the same way <code>helm template --kube-version</code> does. Charts that choose an API version based on the cluster version render the way they would on your cluster.</li>
  <li>It compares the API version and kind of every rendered resource with a built-in list of removals.</li>
</ol>

  <template data-topic="cluster-facts" data-group="Guides" data-title="Read a cluster">
<p class="docs-lede"><code>stageproof facts export</code> reads a cluster you name and writes a JSON file. The check reads that file with <code>--cluster-facts</code>. It does not read the file from git. The released binary is v0.3.1.</p>

<dl class="doc-facts">
  <div><dt>Use it when</dt><dd>You want the Kubernetes version, the stored custom resource versions, and the node architectures to come from the cluster, instead of being typed on the command.</dd></div>
  <div><dt>Reads</dt><dd>Server version, node architecture, custom resource definitions, validating admission policies and bindings, StorageClass names, Argo CD Application chart versions, and Flux HelmRelease chart versions. Helm release Secrets are read only with <code>--helm-releases</code>.</dd></div>
  <div><dt>Does not read</dt><dd>Secret values, Helm values, or <code>stringData</code>. The calls are <code>get</code> and <code>list</code>. The default role is <code>deploy/facts-clusterrole.yaml</code> and it does not include Secrets. <code>--helm-releases</code> also needs <code>deploy/facts-helm-releases-clusterrole.yaml</code>.</dd></div>
</dl>

apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: app
          image: nginx:1.27
          env:
            - name: A
              value: "1"
            - name: B
              value: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
        helm.sh/chart: demo-1.1.0
    spec:
      containers:
        - name: app
          image: nginx:1.28
          env:
            - name: B
              value: "2"
            - name: A
              value: "1"
